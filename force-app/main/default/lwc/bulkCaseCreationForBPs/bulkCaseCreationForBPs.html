<template>
    <lightning-card title="Bulk Case Creation (BP Based)">
        <div class="slds-p-around_medium">

            <!-- Upload -->
            <lightning-input
                type="file"
                label="Upload CSV / Excel File"
                accept=".csv,.xlsx,.xls"
                onchange={handleFileChange}
                disabled={isProcessing}>
            </lightning-input>

            <template if:true={fileName}>
                <p class="slds-m-top_x-small">
                    File: <strong>{fileName}</strong>
                </p>
                <p>Total Rows: {totalRows}</p>
            </template>

            <!-- Spinner -->
            <template if:true={isProcessing}>
                <div class="slds-box slds-m-top_medium slds-text-align_center">
                    <lightning-spinner size="small"></lightning-spinner>
                    <p class="slds-m-top_small">
                        Creating cases in the background…
                    </p>
                </div>
            </template>


            <!-- Preview -->
            <template if:true={readyToUpload}>
                <h3 class="slds-text-heading_small slds-m-top_medium">
                    Preview (records {previewStart} – {previewEnd} of {previewSource.length})
                </h3>

                <div style="height:300px; overflow:auto; border:1px solid #ddd;">
                    <lightning-datatable
                        key-field="__rowKey"
                        data={previewData}
                        columns={previewColumns}
                        hide-checkbox-column>
                    </lightning-datatable>
                </div>

                <template if:true={isPreviewLimited}>
                    <div class="slds-text-color_weak slds-align_absolute-center slds-m-top_x-small">
                        Preview limited to first 1000 records. All records will be uploaded.
                    </div>
                </template>

                <!-- Pagination -->
                <div class="slds-align_absolute-center slds-m-top_small">
                    <lightning-button
                        label="Previous"
                        onclick={handlePrev}
                        disabled={disablePrev}>
                    </lightning-button>
                    <span class="slds-m-horizontal_small">Page {currentPage} of {totalPages}</span>
                    <lightning-button
                        label="Next"
                        onclick={handleNext}
                        disabled={disableNext}>
                    </lightning-button>
                </div>

                <!-- Actions -->
                <div class="slds-align_absolute-center slds-m-top_medium">
                    <lightning-button
                        variant="brand"
                        label="Create Cases"
                        onclick={handleUpload}
                        disabled={disableUpload}
                        class="slds-m-right_small">
                    </lightning-button>
                    <lightning-button label="Reset" onclick={handleReset}></lightning-button>
                </div>
            </template>

            <!-- Result -->
