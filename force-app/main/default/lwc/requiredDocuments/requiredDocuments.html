<template>
    <lightning-card>
        <!-- Single Column Layout -->
        <div class="single-column-container">
            
            <!-- Name Transfer Section - Always at the top -->
            <div class="slds-box name-transfer-section">
                <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                    <!-- Left side: Text -->
                    <div class="slds-col slds-no-flex">
                        <span class="slds-text-heading_small">Name Transfer Request Status</span>
                    </div>
                    
                    <!-- Middle: Combobox -->
                    <div class="slds-col slds-no-flex">
                        <lightning-combobox
                            name="nameTransferStatus"
                            label=""
                            value={nameTransferStatus}
                            options={nameTransferStatusOptions}
                            onchange={handleNameTransferStatusChange}
                            variant="label-hidden"
                            class="inline-combobox">
                        </lightning-combobox>
                    </div>
                    
                    <!-- Right side: Save Button -->
                    <div class="slds-col slds-no-flex">
                        <lightning-button
                            label="Save"
                            onclick={saveNameTransferStatus}
                            variant="brand"
                            size="small">
                        </lightning-button>
                    </div>
                </div>

                <!-- Rejection Reason - Only shows when status is Rejected -->
                <template if:true={showNameTransferRejectionReason}>
                    <div class="slds-m-top_medium">
                        <div class="slds-grid slds-grid_vertical-align-center slds-m-bottom_x-small">
                            <div class="slds-col slds-size_3-of-12">
                                <label class="slds-form-element__label slds-text-heading_small">
                                    Reason for Name Transfer Rejection
                                    <span class="slds-required">*</span>
                                </label>
                            </div>
                            <div class="slds-col slds-size_9-of-12">
                                <lightning-textarea
                                    name="nameTransferRejectionReason"
                                    label=""
                                    value={nameTransferRejectionReason}
                                    onchange={handleNameTransferRejectionReasonChange}
                                    variant="label-hidden"
                                    placeholder="Please provide detailed reason for rejection..."
                                    required={isNameTransferRejectionReasonRequired}
                                    message-when-value-missing="Rejection reason is required when status is Rejected"
                                    maxlength="1000"
                                    class="rejection-reason-textarea">
                                </lightning-textarea>
                            </div>
                        </div>
                    </div>
                </template>
            </div>

            <!-- Documents Section - Below Name Transfer -->
            <div class="slds-box documents-section">
                <template if:true={files.length}>
                    <!-- File List when documents exist -->
                    <div class="slds-grid slds-gutters">
                        <!-- Left: File List -->
                        <div class="slds-col slds-size_1-of-3">
                            <div class="file-list-container slds-scrollable_y" style="height: 400px;">
                                <ul class="custom-file-list">
                                    <template for:each={files} for:item="file">
                                        <li key={file.contentVersionId}
                                            class="file-item slds-grid slds-p-around_x-small slds-border_bottom
                                                {file.contentVersionId === activeFileId ? 'selected' : ''}">

                                            <!-- Approval Icons -->
                                            <template if:true={file.isApproved}>
                                                <lightning-icon icon-name="utility:success" size="small" class="my-utility-icon"></lightning-icon>
                                            </template>
                                            <template if:true={file.isRejected}>
                                                <lightning-icon icon-name="utility:close" size="small" class="my-utility-icon2"></lightning-icon>
                                            </template>
                                            <template if:true={file.isPending}>
                                                <lightning-icon icon-name="utility:clock" size="small" class="my-utility-icon1"></lightning-icon>
                                            </template>

                                            <!-- File Details -->
                                            <div class="slds-col slds-truncate">
                                                <div class="file-title slds-truncate"
                                                     title={file.title}
                                                     onclick={handleTitleClick}
                                                     data-id={file.contentVersionId}
                                                     data-url={file.fileUrl}>
                                                    {file.title}.{file.fileType}
                                                    <div class="file-date slds-text-color_weak slds-text-body_small">
                                                        {file.uploadDate}
                                                    </div>
                                                    <div class="file-date slds-text-color_weak slds-text-body_small">
                                                        Uploaded By: {file.uploadedBy}
                                                    </div>
                                                </div>
                                            </div>
                                        </li>
                                    </template>
                                </ul>
                            </div>
                        </div>

                        <!-- Right: Preview when file is selected -->
                        <div class="slds-col slds-size_2-of-3">
                            <template if:true={previewUrl}>
                                <!-- Category + Option Checkboxes -->
                                <div class="slds-grid slds-wrap">
                                    <template for:each={categories} for:item="category">
                                        <div key={category.Id} class="slds-size_1-of-1 slds-m-bottom_small">
                                            <div class="slds-checkbox">
                                                <input type="checkbox" 
                                                       id={category.Id}
                                                       checked={category.checked}
                                                       onchange={handleCategorySelect}
                                                       data-id={category.Id} />
                                                <label class="slds-checkbox__label" for={category.Id}>
                                                    <span class="slds-checkbox_faux"></span>
                                                    <span class="slds-form-element__label">
                                                        {category.Category_Name__c}
                                                    </span>
                                                </label>
                                            </div>

                                            <div class="slds-p-left_small">
                                                <template for:each={category.options} for:item="option">
                                                    <div key={option.Id} class="slds-checkbox slds-m-top_xx-small">
                                                        <input type="checkbox"
                                                               id={option.Id}
                                                               value={option.Id}
                                                               checked={option.checked}
                                                               onchange={handleDocumentSelect} />
                                                        <label class="slds-checkbox__label" for={option.Id}>
                                                            <span class="slds-checkbox_faux"></span>
                                                            <span class="slds-form-element__label">
                                                                {option.Option_Name__c}
                                                                <template if:true={option.Is_Required__c}>
                                                                    <lightning-icon icon-name="utility:required"
                                                                                    size="x-small"
                                                                                    class="slds-m-left_xx-small">
                                                                    </lightning-icon>
                                                                </template>
                                                            </span>
                                                        </label>
                                                    </div>
                                                </template>
                                            </div>
                                        </div>
                                    </template>
                                </div>

                                <!-- Status & Reason -->
                                <div class="slds-grid slds-wrap slds-m-top_small">
                                    <div class="slds-col slds-size_1-of-2 slds-p-right_x-small">
                                        <lightning-combobox
                                            placeholder="Status"
                                            value={selectedStatus}
                                            options={statusOptions}
                                            variant="label-hidden"
                                            onchange={handleStatusChange}>
                                        </lightning-combobox>
                                    </div>
                                    <template if:true={showReason}>
                                        <div class="slds-col slds-size_1-of-2">
                                            <lightning-combobox
                                                placeholder="Select reason for Rejection"
                                                value={selectReason}
                                                options={reasonOptions}
                                                variant="label-hidden"
                                                onchange={handleReasonChange}>
                                            </lightning-combobox>
                                        </div>
                                    </template>
                                </div>

                                <!-- Comments and Submit -->
                                <lightning-input
                                    class="slds-m-top_x-small"
                                    placeholder="Add Comments"
                                    value={selectedRemarks}
                                    variant="label-hidden"
                                    onchange={handleRemarksChange}>
                                </lightning-input>

                                <lightning-button label="Submit"
                                                  onclick={handleSave}
                                                  variant="brand"
                                                  class="slds-m-top_small">
                                </lightning-button>
                                
                                <!-- Rotation Controls
                                <div class="slds-m-bottom_small slds-text-align_right slds-clearfix">
                                    <lightning-button-icon
                                        icon-name="utility:undo"
                                        alternative-text="Rotate Left"
                                        onclick={handleRotateLeft}
                                        variant="border-filled"
                                        class="slds-m-right_x-small">
                                    </lightning-button-icon>

                                    <lightning-button-icon
                                        icon-name="utility:redo"
                                        alternative-text="Rotate Right"
                                        onclick={handleRotateRight}
                                        variant="border-filled"
                                        class="slds-m-right_x-small">
                                    </lightning-button-icon>

                                    <lightning-button-icon
                                        icon-name="utility:close"
                                        alternative-text="Reset Rotation"
                                        title="Reset Rotation"
                                        onclick={resetRotation}
                                        variant="border-filled">
                                    </lightning-button-icon>
                                </div> -->

                                <!-- Document Preview Container -->
                                <div class="preview-wrapper" style={containerStyle}>
                                    <iframe
                                        src={previewUrl}
                                        class="preview-iframe"
                                        style={iframeStyle}>
                                    </iframe>
                                </div>



                                <!-- Document Preview -->
                                <!-- </div>
                                    <h2 class="slds-text-heading_medium slds-p-bottom_small">{previewTitle}</h2>
                                    <iframe
                                        src={previewUrl}
                                        width="100%"
                                        height="400px"
                                        style={iframeStyle}>
                                    </iframe>

                                </div> -->
                            </template>
                        </div>
                    </div>
                </template>

                <!-- No Documents Message -->
                <template if:false={files.length}>
                    <div class="no-documents-container">
                        <div class="slds-align_absolute-center slds-p-vertical_xx-large">
                            <div class="slds-text-align_center">
                                <lightning-icon icon-name="utility:document" size="large" class="slds-m-bottom_small"></lightning-icon>
                                <h3 class="slds-text-heading_medium slds-m-bottom_x-small">No documents for approval</h3>
                                <p class="slds-text-color_weak">Upload documents to begin the approval process</p>
                            </div>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </lightning-card>
</template>
