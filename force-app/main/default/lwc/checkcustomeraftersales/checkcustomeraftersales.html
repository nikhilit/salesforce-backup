<template>

    <template if:true={load}>
        <lightning-spinner variant="brand"></lightning-spinner>
    </template>

<lightning-card>

        <!-- CUSTOMER AVAILABILITY -->
       <template if:true={showCheckBox}>
    <template if:true={showCustomerAvailability}>
        <lightning-radio-group
            label="Is Customer Available?"
            options={availabilityOptions}
            value={customerAvailability}
            type="radio"
            onchange={handleAvailabilityChange}>
        </lightning-radio-group>
    </template>
</template>


        <!-- SAVE (YES) -->
        <template if:true={customerAvilable}>
            <div class="slds-align_absolute-center slds-m-top_medium">
                <lightning-button
                    label="Save"
                    variant="brand"
                    onclick={handleCusAvilSave}>
                </lightning-button>
            </div>
        </template>

        <!-- UNSUCCESSFUL VISIT -->
        <template if:true={customerNotAvailableDetails}>
            <lightning-card title="Unsuccessful Visit Details">

                <lightning-combobox
                    label="Reason for Unsuccessful Visit"
                    options={reasonOptions}
                    value={selectedReason}
                    onchange={handleReasonChange}>
                </lightning-combobox>

                <template if:true={showRemarks}>
                    <lightning-textarea
                        label="Remarks"
                        onchange={handleNotesChange}>
                    </lightning-textarea>
                </template>

                <template if:true={showFollowUpDate}>
                    <lightning-input
                        type="datetime"
                        label="Follow-Up Visit Date"
                        onchange={handleDateTimeChange}>
                    </lightning-input>
                </template>

                <template if:true={imageUploadPage}>
                    <div class="slds-align_absolute-center slds-m-top_medium">
                    <lightning-button
                        icon-name="utility:upload"
                        label="Upload Photo"
                        onclick={triggerFileUpload}>
                    </lightning-button>
                    </div>

                    <input type="file" multiple style="display:none"
                           onchange={handleFilesInputChange}/>
                </template>

<template if:true={photoUploadSlots.length}>
    <div class="preview-list slds-m-top_small">
        <template for:each={photoUploadSlots} for:item="file" for:index="index">
            <div key={file.fileName} class="preview-item">

                <!-- File Name -->
                <span class="file-name" title={file.fileName}>
                    {file.fileName}
                </span>

                <!-- Action Icons -->
                <lightning-button-icon
                    icon-name="utility:preview"
                    variant="bare"
                    alternative-text="Preview"
                    class="slds-m-right_small"
                    data-index={index}
                    onclick={handlePreview}>
                </lightning-button-icon>

                <lightning-button-icon
                    icon-name="utility:delete"
                    variant="bare"
                    alternative-text="Delete"
                    class="slds-m-right_small"
                    data-index={index}
                    onclick={handleDelete}>
                </lightning-button-icon>

            </div>
        </template>
    </div>
</template>



                <div class="slds-align_absolute-center slds-m-top_medium">
                    <lightning-button
                        label="Submit Unsuccessful Visit"
                        variant="brand"
                        onclick={handleSubmit}>
                    </lightning-button>
                </div>

                <!-- Preview Modal -->
<template if:true={showPreviewModal}>
    <section role="dialog" class="slds-modal slds-fade-in-open">
        <div class="slds-modal__container">

            <header class="slds-modal__header">
                <h2 class="slds-text-heading_medium">{previewFileName}</h2>
            </header>

            <div class="slds-modal__content slds-p-around_medium slds-text-align_center">

                <template if:true={isPreviewImage}>
                    <img src={previewUrl} style="max-width:100%; max-height:400px;" />
                </template>

                <template if:true={isPreviewPdf}>
                    <iframe src={previewUrl}
                            width="100%"
                            height="400px">
                    </iframe>
                </template>

            </div>

            <footer class="slds-modal__footer">
                <lightning-button
                    label="Close"
                    onclick={closePreview}>
                </lightning-button>
            </footer>

        </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
</template>


            </lightning-card>
        </template>
</lightning-card>
    

</template>
