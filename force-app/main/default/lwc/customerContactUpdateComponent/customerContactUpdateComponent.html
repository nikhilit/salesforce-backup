<template>
    <article class="slds-card slds-is-relative" style="overflow: hidden;">
        <template if:true={load}>
            <lightning-spinner class="spinner-message" variant="brand"></lightning-spinner>
        </template>
        <div
            class="slds-border--bottom slds-card__header slds-grid slds-m-around--none slds-p-around--small slds-theme_shade">
            <header class="slds-media slds-media_center slds-has-flexi-truncate">
                <div class="slds-media__figure">
                    <lightning-icon icon-name='standard:contact' alternative-text='contact' title='Contact'>
                    </lightning-icon>
                </div>
                <div class="slds-media__body">
                    <h2 class="slds-card__header-title">
                        <span>Customer Contact Update</span>
                    </h2>
                </div>
            </header>
        </div>
        <div class="slds-card__body slds-card__body_inner">
            <div class="slds-grid slds-wrap">
                <div class="slds-col slds-size_1-of-2 slds-p-around_xx-small">
                    <c-custom-input-field-component input-label="Old Mobile Number" disabled="true"
                        input-value={oldMobileNumber}>
                    </c-custom-input-field-component>
                </div>
                <div class="slds-col slds-size_1-of-2 slds-p-around_xx-small">
                    <c-custom-input-field-component input-label="New Mobile Number" onchange={handleFieldChange}
                        data-field-name="newMobileNumber" input-value={newMobileNumber} input-type="number">
                    </c-custom-input-field-component>
                </div>
                <div class="slds-col slds-size_1-of-2 slds-p-around_xx-small">
                    <c-custom-input-field-component input-label="Old Residence Telephone" disabled="true"
                        input-value={oldResidenceTelephone}>
                    </c-custom-input-field-component>
                </div>
                <div class="slds-col slds-size_1-of-2 slds-p-around_xx-small">
                    <c-custom-input-field-component input-label="New Residence Telephone" onchange={handleFieldChange}
                        data-field-name="newResidenceTelephone" input-value={newResidenceTelephone}
                        input-type="number">
                    </c-custom-input-field-component>
                </div>
                <div class="slds-col slds-size_1-of-2 slds-p-around_xx-small">
                    <c-custom-input-field-component input-label="Old Office Telephone" disabled="true"
                        input-value={oldOfficeTelephone}>
                    </c-custom-input-field-component>
                </div>
                <div class="slds-col slds-size_1-of-2 slds-p-around_xx-small">
                    <c-custom-input-field-component input-label="New Office Telephone" onchange={handleFieldChange}
                        data-field-name="newOfficeTelephone" input-value={newOfficeTelephone} input-type="number">
                    </c-custom-input-field-component>
                </div>
                <div class="slds-col slds-size_1-of-2 slds-p-around_xx-small">
                    <c-custom-input-field-component input-label="Old Email" disabled="true"
                         input-value={oldEmail}>
                    </c-custom-input-field-component>
                </div>
                <div class="slds-col slds-size_1-of-2 slds-p-around_xx-small">
                    <c-custom-input-field-component input-label="New Email" input-type="text"
                        onchange={handleFieldChange} data-field-name="newEmail" input-value={newEmail}>
                    </c-custom-input-field-component>
                </div>
                <div class="slds-col slds-size_1-of-1 slds-p-around_xx-small">
                    <c-custom-input-field-component input-label="Remarks" input-type="textarea"
                        onchange={handleFieldChange} data-field-name="remarks" input-value={remarks}>
                    </c-custom-input-field-component>
                </div>
                
            </div>
        </div>
        <footer class="slds-card__footer">
            <lightning-button variant="neutral" label="Cancel" onclick={handleCancel} class="slds-p-right_x-small">
            </lightning-button>
            <lightning-button variant="brand" label="Submit" onclick={handleSave} class="slds-p-left_x-small">
            </lightning-button>
        </footer>
    </article>
</template>
