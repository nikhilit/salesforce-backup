<template>
    <template if:true={secondPage}>
        <div class="custom-container slds-is-relative"> 
 
            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
            </template>

            <template if:true={error}>
                <div class="slds-text-color_error">{error}</div>
            </template>

            <!-- DIRECT VISITS TAB -->
            <template if:true={showDirectVisits}>

                <div class="section-header slds-grid slds-grid_align-spread slds-grid_vertical-align-center" style="background-color: #57c062;">

                    <lightning-icon style="--slds-c-icon-color-foreground-default: white;" icon-name="utility:back"
                        size="small" class="custom-white-icon" onclick={handleBack}>
                    </lightning-icon>

                    <div class="header-title">
                        {headerLabels.directVisit}
                    </div>

                    <lightning-icon style="--slds-c-icon-color-foreground-default: white;" icon-name="utility:search"
                        size="small" class="custom-white-icon" if:false={searchToggle} onclick={handleSearch}>
                    </lightning-icon>
                    
                    <lightning-icon style="--slds-c-icon-color-foreground-default: white;" icon-name="utility:close"
                        size="small" class="custom-white-icon" if:true={searchToggle} onclick={handleSearch}>
                    </lightning-icon>

                </div>

                <div class="slds-border_bottom slds-p-around_x-small" if:true={searchToggle}>
                    <lightning-input
                        type="search"
                        variant="label-hidden"
                        value={currentSearchValue}
                        onchange={filterDirectVisits}
                        placeholder="Search Direct Payment...">
                    </lightning-input>
                </div>
                
                <div class="custom-section">

                    <template for:each={directVisitAppointments} for:item="appt">

                        <div key={appt.id} class="slds-border--bottom">
                            <div class="appointment-card appointment-clickable" data-id={appt.id}
                                data-account-id={appt.Account} onclick={handleAppointmentClick}>
                                <div class="slds-grid">
                                    <div class="slds-media slds-col slds-size_3-of-4">
                                        <div class="slds-media__figure">
                                            <lightning-icon icon-name="utility:user" size="x-small"
                                                style="--slds-c-icon-color-foreground-default: #57c062;">
                                            </lightning-icon>
                                        </div>
                                        <div class="slds-media__body">
                                            <div class="appt-header">
                                                <div class="appt-account-name">{appt.customerName}</div>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="slds-grid">
                                    <div class="slds-col slds-size_2-of-6" style="margin-left: 3px; padding-right: 5px;">
                                        <div class="card" style="card-total">
                                            <span class="card-label card-badge" style="font-size: 11px;">{appt.formattedSchedEndDate}</span>
                                        </div>
                                    </div>
                                    <div class="slds-col slds-size_2-of-6">
                                        <div class="card" style="card-total">
                                            <span class="card-label card-badge" style="font-size: 11px;">{appt.formattedDueAmount}</span>
                                        </div>
                                    </div>
                                        <div></div>
                                    <div class="slds-col slds-size_2-of-6" style="margin-left: 5px; padding-right: 10px;">
                                        <div class="card" style="card-total">
                                        <span class="card-label card-badge" style="font-size: 11px;">Online Paid</span>
                                        
                                        </div>
                                    </div> 
                                </div>
                            </div>
                        </div>             

                    </template> 

                    <template if:false={directVisitAppointments.length}>
                        <p class="slds-text-body_regular slds-text-align_center" style="font-size: 15px;">No appointments for Today.</p>
                    </template>

                    <template if:true={isLoading}>
                        <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
                    </template>
                    
                    <template if:true={error}>
                        <div class="slds-text-color_error">{error}</div>
                    </template>

                </div>
            </template>

            <!-- RANDOM VISITS TAB -->
            <template if:true={showRandomVisits}>

                <div class="section-header slds-grid slds-grid_align-spread slds-grid_vertical-align-center" style="background-color: #57c062;">

                    <lightning-icon style="--slds-c-icon-color-foreground-default: white;" icon-name="utility:back"
                        size="small" class="custom-white-icon" onclick={handleBack}>
                    </lightning-icon>

                    <div class="header-title">
                        {headerLabels.randomVisit}
                    </div>

                    <lightning-icon style="--slds-c-icon-color-foreground-default: white;" icon-name="utility:search"
                        size="small" class="custom-white-icon" if:false={searchToggle} onclick={handleSearch}>
                    </lightning-icon>
                    
                    <lightning-icon style="--slds-c-icon-color-foreground-default: white;" icon-name="utility:close"
                        size="small" class="custom-white-icon" if:true={searchToggle} onclick={handleSearch}>
                    </lightning-icon>

                </div>

                <div class="slds-border_bottom slds-p-around_x-small" if:true={searchToggle}>
                    <lightning-input
                        type="search"
                        variant="label-hidden"
                        value={currentSearchValue}
                        onchange={filterRandomVisits}
                        placeholder="Search Random Visits...">
                    </lightning-input>
                </div>
                
                <div class="custom-section">

                    <template for:each={randomVisitAppointments} for:item="appt">

                        <div key={appt.id} class="slds-border--bottom">
                            <div class="appointment-card appointment-clickable" data-id={appt.id}
                                data-account-id={appt.Account} onclick={handleAppointmentClick}>
                                <div class="slds-grid">
                                    <div class="slds-media slds-col slds-size_3-of-4">
                                        <div class="slds-media__figure">
                                            <lightning-icon icon-name="utility:user" size="x-small"
                                                style="--slds-c-icon-color-foreground-default: #57c062;">
                                            </lightning-icon>
                                        </div>
                                        <div class="slds-media__body">
                                            <div class="appt-header">
                                                <div class="appt-account-name">{appt.customerName}</div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                
                                <!-- <div class="slds-grid" style="margin-bottom: 8px;">
                                    <div class="slds-col slds-size_3-of-4" style="margin-left: 26px;">
                                        <div class="appt-summary">{appt.DetailAccountSummary}</div>
                                    </div>
                                    <div class="slds-col slds-size_1-of-4"></div>
                                </div> -->

                                <div class="slds-grid">
                                    <div class="slds-col slds-size_2-of-6" style="margin-left: 3px; padding-right: 5px;">
                                        <div class="card" style="card-total">
                                            <span class="card-label card-badge" style="font-size: 11px;">{appt.formattedSchedEndDate}</span>
                                        </div>
                                    </div>
                                    <div class="slds-col slds-size_2-of-6">
                                        <div class="card" style="card-total">
                                            <span class="card-label card-badge" style="font-size: 11px;">{appt.formattedDueAmount}</span>
                                        </div>
                                    </div>
                                        <div></div>
                                    <div class="slds-col slds-size_2-of-6" style="margin-left: 5px; padding-right: 10px;">
                                        <div class="card" style="card-total">
                                        <span class="card-label card-badge" style="font-size: 11px;">{appt.appointmentType}</span>
                                        
                                        </div>
                                    </div> 
                                </div>
                            </div>
                        </div>             

                    </template> 

                    <template if:false={randomVisitAppointments.length}>
                        <p class="slds-text-body_regular slds-text-align_center" style="font-size: 15px;">No appointments for Today.</p>
                    </template>

                    <template if:true={isLoading}>
                        <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
                    </template>
                    
                    <template if:true={error}>
                        <div class="slds-text-color_error">{error}</div>
                    </template>

                </div>
            </template>


            <!-- FOLLOW-UP REMARKS TAB -->
            <template if:true={showFollowUpRemarks}>

                <div class="section-header slds-grid slds-grid_align-spread slds-grid_vertical-align-center" style="background-color: #57c062;">

                    <lightning-icon style="--slds-c-icon-color-foreground-default: white;" icon-name="utility:back"
                        size="small" class="custom-white-icon" onclick={handleBack}>
                    </lightning-icon>

                    <div class="header-title">
                        {headerLabels.followUp}
                    </div>

                    <lightning-icon style="--slds-c-icon-color-foreground-default: white;" icon-name="utility:search"
                        size="small" class="custom-white-icon" if:false={searchToggle} onclick={handleSearch}>
                    </lightning-icon>
                    
                    <lightning-icon style="--slds-c-icon-color-foreground-default: white;" icon-name="utility:close"
                        size="small" class="custom-white-icon" if:true={searchToggle} onclick={handleSearch}>
                    </lightning-icon>

                </div>

                <div class="slds-border_bottom slds-p-around_x-small" if:true={searchToggle}>
                    <lightning-input
                        type="search"
                        variant="label-hidden"
                        value={currentSearchValue}
                        onchange={filterFollowUpRemarks}
                        placeholder="Search this list...">
                    </lightning-input>
                </div>
                
                <div class="custom-section">

                    <template for:each={filteredFollowUpGroup} for:item="group">

                        <ul key={group.name} class="remark-list">

                            <li class="remark-card" data-remark={group.name} onclick={handleFollowUpClick}>

                                <div class="slds-grid slds-wrap slds-grid_align-spread">

                                    <div class="slds-col slds-size_1-of-1">

                                        <div class="slds-grid" style="width: 100%;">
                                            <div class="slds-col slds-size_1-of-7 slds-align_absolute-center slds-var-m-around_small">
                                                <div class="slds-media__figure">
                                                    <div class="emoji-wrapper">{icons.followUp}</div>
                                                </div>
                                            </div>
                                            <div class="slds-col slds-size_4-of-7 slds-var-p-around_x-small slds-align-middle">
                                                <p style="color: black;font-size:15px;">{group.name}</p>
                                            </div>
                                            <div class="slds-col slds-size_2-of-7  slds-var-p-around_x-small slds-align_absolute-center" >
                                                <div class="round slds-align--absolute-center"> <b>{group.count}</b></div>
                                            </div>

                                        </div>

                                    </div>

                                </div>

                            </li>

                        </ul>              

                    </template> 

                    <template if:false={followUpGroup.length}>
                        <p class="slds-text-body_regular slds-text-align_center" style="font-size: 15px;">No follow-up appointments.</p>
                    </template>

                    <template if:true={isLoading}>
                        <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
                    </template>
                    
                    <template if:true={error}>
                        <div class="slds-text-color_error">{error}</div>
                    </template>

                </div>

            </template>

            <!-- FOLLOW-UP APPOINTMENTS TAB -->
            <template if:true={showFollowUpAppointments}>

                <div class="section-header slds-grid slds-grid_align-spread slds-grid_vertical-align-center" style="background-color: #57c062;">

                    <lightning-icon style="--slds-c-icon-color-foreground-default: white;" icon-name="utility:back"
                        size="small" class="custom-white-icon" onclick={backToFollowUp}>
                    </lightning-icon>

                    <div class="header-title">
                        Appointments for "{selectedFollowUpRemark}"
                    </div>

                    <lightning-icon style="--slds-c-icon-color-foreground-default: white;" icon-name="utility:search"
                        size="small" class="custom-white-icon" if:false={searchToggle} onclick={handleSearch}>
                    </lightning-icon>
                    
                    <lightning-icon style="--slds-c-icon-color-foreground-default: white;" icon-name="utility:close"
                        size="small" class="custom-white-icon" if:true={searchToggle} onclick={handleSearch}>
                    </lightning-icon>

                </div>

                <div class="slds-border_bottom slds-p-around_x-small" if:true={searchToggle}>
                    <lightning-input
                        type="search"
                        variant="label-hidden"
                        value={currentSearchValue}
                        onchange={filterDataFollowUpAppt}
                        placeholder="Search this list...">
                    </lightning-input>
                </div>
                
                <div class="custom-section">

                    <template for:each={appointmentGroup} for:item="appt">

                        <div key={appt.id} class="slds-border--bottom">
                            <div class="appointment-card appointment-clickable" data-id={appt.id}
                                data-account-id={appt.Account} onclick={handleAppointmentClick}>
                                <div class="slds-grid">
                                    <div class="slds-media slds-col slds-size_3-of-4">
                                        <div class="slds-media__figure">
                                            <lightning-icon icon-name="utility:user" size="x-small"
                                                style="--slds-c-icon-color-foreground-default: #57c062;">
                                            </lightning-icon>
                                        </div>
                                        <div class="slds-media__body">
                                            <div class="appt-header">
                                                <div class="appt-account-name">{appt.customerName}</div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="slds-grid" style="margin-bottom: 8px;">
                                    <div class="slds-col slds-size_3-of-4" style="margin-left: 26px;">
                                        <div class="appt-summary">{appt.DetailAccountSummary}</div>
                                    </div>
                                    <div class="slds-col slds-size_1-of-4"></div>
                                </div>

                                <div class="slds-grid">
                                    <div class="slds-col slds-size_2-of-6" style="margin-left: 3px; padding-right: 5px;">
                                            <div class="card" style="card-total">
                                            <span class="card-label card-badge" style="font-size: 11px;">{appt.formattedSchedEndDate}</span>
                                            </div>
                                    </div>
                                    <div class="slds-col slds-size_2-of-6">
                                        <div class="card" style="card-total">
                                            <span class="card-label card-badge" style="font-size: 11px;">{appt.formattedDueAmount}</span>
                                        </div>
                                    </div>
                                        <div></div>
                                    <div class="slds-col slds-size_2-of-6" style="margin-left: 5px; padding-right: 10px;">
                                        <div class="card" style="card-total">
                                        <span class="card-label card-badge" style="font-size: 11px;">{appt.appointmentType}</span>
                                        
                                        </div>
                                    </div> 
                                </div>
                            </div>
                        </div>             

                    </template> 

                    <template if:false={appointmentGroup.length}>
                        <p class="slds-text-body_regular slds-text-align_center" style="font-size: 15px;">No appointments for Today.</p>
                    </template>

                    <template if:true={isLoading}>
                        <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
                    </template>
                    
                    <template if:true={error}>
                        <div class="slds-text-color_error">{error}</div>
                    </template>

                </div>

            </template>

            

            <!-- NORMAL APPOINTMENTS: Location -> Road -> Building -> Appointments -->
            <template if:true={showLocation}>

                <div class="section-header slds-grid slds-grid_align-spread slds-grid_vertical-align-center" style="background-color: #57c062;">

                    <lightning-icon style="--slds-c-icon-color-foreground-default: white;" icon-name="utility:back"
                        size="small" class="custom-white-icon" onclick={handleBack}>
                    </lightning-icon>

                    <!-- <div class="header-title">
                        Locations
                    </div> -->
                    <div class="header-title">
                        {headerLabels.location}
                    </div>

                    <lightning-icon style="--slds-c-icon-color-foreground-default: white;" icon-name="utility:search"
                        size="small" class="custom-white-icon" if:false={searchToggle} onclick={handleSearch}>
                    </lightning-icon>
                    
                    <lightning-icon style="--slds-c-icon-color-foreground-default: white;" icon-name="utility:close"
                        size="small" class="custom-white-icon" if:true={searchToggle} onclick={handleSearch}>
                    </lightning-icon>

                </div>

                <div class="slds-border_bottom slds-p-around_x-small" if:true={searchToggle}>
                    <lightning-input
                        type="search"
                        variant="label-hidden"
                        value={currentSearchValue}
                        onchange={filterDataLocation}
                        placeholder="Search this list...">
                    </lightning-input>
                </div>
                
                <div class="custom-section">
            
                    <template for:each={locationGroup} for:item="loc">

                        <ul key={loc.name} class="building-list">

                            <li class="building-card" data-location={loc.name} onclick={toggleLoc}>

                                <div class="slds-grid slds-wrap slds-grid_align-spread">

                                    <div class="slds-col slds-size_1-of-1">

                                        <div class="slds-grid" style="width: 100%;">
                                            <div class="slds-col slds-size_1-of-7 slds-align_absolute-center slds-var-m-around_small">
                                                <div class="slds-media__figure">
                                                    <!-- <div class="emoji-wrapper">📍</div> -->
                                                    <div class="emoji-wrapper">{icons.location}</div>
                                                </div>
                                            </div>
                                            <div class="slds-col slds-size_4-of-7 slds-var-p-around_x-small slds-align-middle">
                                                <p style="color: black;font-size:15px;">{loc.name}</p>
                                            </div>
                                            <div class="slds-col slds-size_2-of-7  slds-var-p-around_x-small slds-align_absolute-center" >

                                            </div>

                                        </div>

                                    </div>

                                </div>

                            </li>

                        </ul>

                    <template if:false={locationGroup.length}>

                    </template>

                    <template if:true={isLoading}>

                    </template>
                    
                    <template if:true={error}>
                        <div class="slds-text-color_error">{error}</div>
                    </template>

                </div>
            </template>


            <template if:true={showRoad}>

                <div class="section-header slds-grid slds-grid_align-spread slds-grid_vertical-align-center" style="background-color: #57c062;">

                    <lightning-icon style="--slds-c-icon-color-foreground-default: white;" icon-name="utility:back"
                        size="small" class="custom-white-icon" onclick={backToLocation}>
                    </lightning-icon>

                    <!-- <div class="header-title">
                        Roads
                    </div> -->
                    <div class="header-title">
                        {headerLabels.road}
                    </div>

                    <lightning-icon style="--slds-c-icon-color-foreground-default: white;" icon-name="utility:search"

                    </lightning-icon>
                    
                    <lightning-icon style="--slds-c-icon-color-foreground-default: white;" icon-name="utility:close"
                        size="small" class="custom-white-icon" if:true={searchToggle} onclick={handleSearch}>
                    </lightning-icon>

                </div>

                <div class="slds-border_bottom slds-p-around_x-small" if:true={searchToggle}>
                    <lightning-input
                        type="search"
                        variant="label-hidden"
                        value={currentSearchValue}
                        onchange={filterDataRoad}
                        placeholder="Search this list...">
                    </lightning-input>
                </div>
                
                <div class="custom-section">
            
                    <template for:each={roadGroup} for:item="rd">

                        <ul key={rd.name} class="building-list">

                            <li class="building-card" data-road={rd.name} onclick={toggleRoad}>

                                <div class="slds-grid slds-wrap slds-grid_align-spread">

                                    <div class="slds-col slds-size_1-of-1">

                                        <div class="slds-grid" style="width: 100%;">

                                            <div class="slds-col slds-size_1-of-7 slds-align_absolute-center slds-var-m-around_small">
                                                <div class="slds-media__figure">
                                                    <!-- <div class="emoji-wrapper">🌃</div> -->
                                                    <div class="emoji-wrapper">{icons.road}</div>
                                                </div>
                                            </div>
                                            <div class="slds-col slds-size_4-of-7 slds-var-p-around_x-small slds-align-middle">

                                            </div>
                                            <div class="slds-col slds-size_2-of-7  slds-var-p-around_x-small slds-align_absolute-center" >
                                                <div class="round slds-align--absolute-center"> <b>{rd.count}</b></div>
                                            </div>
                                    
                                        </div>

                                    </div>

                                </div>

                            </li>

                        </ul>              

                    </template> 

                    <template if:false={roadGroup.length}>

                    </template>

                    <template if:true={isLoading}>
                        <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
                    </template>
                    
                    <template if:true={error}>
                        <div class="slds-text-color_error">{error}</div>
                    </template>

                </div>

            <template if:true={showBuilding}>

                    <lightning-icon style="--slds-c-icon-color-foreground-default: white;" icon-name="utility:back"

                        Premises
                    </div> -->

                        {headerLabels.building}

                    <lightning-icon style="--slds-c-icon-color-foreground-default: white;" icon-name="utility:close"

                    </lightning-icon>

                </div>

                <div class="slds-border_bottom slds-p-around_x-small" if:true={searchToggle}>
                    <lightning-input

                        variant="label-hidden"
                        value={currentSearchValue}

                    </lightning-input>
                </div>
                
                <div class="custom-section">
            
                    <template for:each={buildingGroup} for:item="bd">

                            <li class="building-card" data-building={bd.name} onclick={toggleBuild}>

                                                <div class="slds-media slds-media_center" style="width: 100%;">
                                                    <div class="slds-media__figure">
                                                        <!-- <div class="emoji-wrapper">
                                                            🏢
                                                        </div> -->

                                                    </div>

                                                        <div class="building-header">
                                                            <div

                                                                <div class="building-name"> {bd.name}

                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="slds-col slds-size_1-of-4 slds-p-left--xx-small align-right">
                                                <div class="card card-total circle-card" onclick={toggleCountSection} data-building={bd.name}>
                                                    <strong>{bd.appointments.length}</strong>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="slds-col slds-size_1-of-1">
                                        <div class="building-address">
                                            <div>{bd.buildingStreet}</div>
                                            <div>{bd.buildingArea}</div>
                                        </div>
                                    </div>
                                </div>
                                <div class="slds-grid slds-gutters_direct-xx-small slds-p-top_small" if:true={bd.statusSection}>
                                    <template for:each={bd.statusCounts} for:item="statusCount">
                                        <div class="slds-col slds-size_1-of-3" key={statusCount.label}>
                                            <div class="card2" data-card={statusCount.label}>
                                                <span class="card-label" style="color:black;">{statusCount.label}</span>
                                                <div>
                                                    <strong style="text-align: end; color: black;">{statusCount.count}</strong>
                                                </div>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </li>
                        </ul>

                    </template> 

                    <template if:false={buildingGroup.length}>
                        <p class="slds-text-body_regular slds-text-align_center" style="font-size: 15px;">No appointments for Today.</p>
                    </template>

                    <template if:true={isLoading}>
                        <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
                    </template>
                    
                    <template if:true={error}>
                        <div class="slds-text-color_error">{error}</div>
                    </template>

                </div>

            </template>


            <template if:true={showAppointment}>

                <div class="section-header slds-grid slds-grid_align-spread slds-grid_vertical-align-center" style="background-color: #57c062;">

                    <lightning-icon style="--slds-c-icon-color-foreground-default: white;" icon-name="utility:back"
                        size="small" class="custom-white-icon" onclick={backToBuilding}>
                    </lightning-icon>

                    <!-- <div class="header-title">
                        Appointments
                    </div> -->
                    <div class="header-title">
                        {headerLabels.appointment}
                    </div>

                    <lightning-icon style="--slds-c-icon-color-foreground-default: white;" icon-name="utility:search"
                        size="small" class="custom-white-icon" if:false={searchToggle} onclick={handleSearch}>
                    </lightning-icon>
                    
                    <lightning-icon style="--slds-c-icon-color-foreground-default: white;" icon-name="utility:close"
                        size="small" class="custom-white-icon" if:true={searchToggle} onclick={handleSearch}>
                    </lightning-icon>

                </div>

                <div class="slds-border_bottom slds-p-around_x-small" if:true={searchToggle}>
                    <lightning-input
                        type="search"
                        variant="label-hidden"
                        value={currentSearchValue}
                        onchange={filterDataAppt}
                        placeholder="Search this list...">
                    </lightning-input>
                </div>
                
                <div class="custom-section">
            
                    <template for:each={appointmentGroup} for:item="appt">

                        <div key={appt.id} class="slds-border--bottom">
                            <div class="appointment-card appointment-clickable" data-id={appt.id}
                                data-account-id={appt.Account} onclick={handleAppointmentClick}>
                                <div class="slds-grid">
                                    <div class="slds-media slds-col slds-size_3-of-4">
                                        <div class="slds-media__figure">
                                            <lightning-icon icon-name="utility:user" size="x-small"
                                                style="--slds-c-icon-color-foreground-default: #57c062;">
                                            </lightning-icon>
                                        </div>
                                        <div class="slds-media__body">
                                            <div class="appt-header">
                                                <div class="appt-account-name">{appt.customerName}</div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="slds-grid" style="margin-bottom: 8px;">
                                    <div class="slds-col slds-size_3-of-4" style="margin-left: 26px;">
                                        <div class="appt-summary">{appt.DetailAccountSummary}</div>
                                    </div>
                                    <div class="slds-col slds-size_1-of-4"></div>
                                </div>

                                <div class="slds-grid">
                                    <div class="slds-col slds-size_2-of-6" style="margin-left: 3px; padding-right: 5px;">
                                            <div class="card" style="card-total">
                                            <span class="card-label card-badge" style="font-size: 11px;">{appt.formattedSchedEndDate}</span>
                                            </div>
                                    </div>
                                    <div class="slds-col slds-size_2-of-6">
                                        <div class="card" style="card-total">
                                            <span class="card-label card-badge" style="font-size: 11px;">{appt.formattedDueAmount}</span>
                                        </div>
                                    </div>
                                        <div></div>
                                    <div class="slds-col slds-size_2-of-6" style="margin-left: 5px; padding-right: 10px;">
                                        <div class="card" style="card-total">
                                        <span class="card-label card-badge" style="font-size: 11px;">{appt.appointmentType}</span>
                                        
                                        </div>
                                    </div> 
                                </div>
                            </div>
                        </div>             

                    </template> 

                    <template if:false={appointmentGroup.length}>
                        <p class="slds-text-body_regular slds-text-align_center" style="font-size: 15px;">No appointments for Today.</p>
                    </template>

                    <template if:true={isLoading}>
                        <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
                    </template>
                    
                    <template if:true={error}>
                        <div class="slds-text-color_error">{error}</div>
                    </template>

                </div>

            </template>
        </div>
    </template>
</template>
