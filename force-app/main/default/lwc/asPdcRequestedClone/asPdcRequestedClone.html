<template>

    <template if:true={showPaidMessage}>

        <div class="modal-container">
            <div class="modal">

                <template if:true={isFieldSense}>
                    <lightning-button label="Back" onclick={handleBackFromPayment}></lightning-button>
                </template>

                <div class="slds-p-around_medium">
                    <p class="slds-text-heading_medium slds-text-color_success">
                        Payment received.
                    </p>
                    <p class="slds-text-body_regular">
                        <strong>Amount Paid:</strong> ₹{paidAmt}
                    </p>
                    <p class="slds-text-body_regular">
                        <strong>Payment Mode:</strong> {paymentMode}
                    </p>
                    <template if:true={pdfReceiptUrl}>
                        <lightning-formatted-url
                            value={pdfReceiptUrl}
                            label="Tap here to view Receipt"
                            target="_blank">
                        </lightning-formatted-url>
                    </template>
                </div>
                <div>
                    <lightning-input 
                        type="text" 
                        value={accountAlternatePhone} 
                        onkeydown={handleKeyDown} 
                        onchange={handleInput} 
                        style="margin-top: 14px;"
                        label="Alternate Mobile no">
                    </lightning-input>
                    </br>
                    <lightning-button label="Send SMS To Customer" onclick={sendPayMsg} varaiant="brand"></lightning-button>
                </div>
            </div>
        </div>
        <!-- <lightning-card> -->
            
        <!-- </lightning-card> -->
    </template>

    <template if:false={showPaidMessage}>
        <template for:each={chequeList} for:item="cheque" for:index="index">
            <div key={cheque.id} class="slds-box slds-theme_default slds-m-top_medium slds-p-around_medium">

                <!-- Header with Cheque Label and Remove Button (hide remove for first cheque) -->
                <div class="slds-grid slds-grid_align-spread slds-m-bottom_small">
                    <h3 class="slds-text-heading_small">Cheque {cheque.displayIndex}</h3>
    
                    <template if:true={index}>
                        <lightning-button-icon 
                            icon-name="utility:close"
                            alternative-text="Remove Cheque"
                            title="Remove"
                            variant="bare"
                            onclick={handleRemoveCheque}
                            data-id={cheque.id}>
                        </lightning-button-icon>
                    </template>
                </div>

                <!-- MICR Code -->
                <lightning-input 
                    label="MICR Code" 
                    value={cheque.micrCode} 
                    data-index={index} 
                    onchange={handleMicrChange}>
                </lightning-input>

                <!-- Bank Info -->
                <lightning-input 
                    label="Bank Name" 
                    value={cheque.bankName}  
                    data-index={index} 
                    data-id="bankName" 
                    onchange={handleDynamicInput}>
                </lightning-input>
                <lightning-input 
                    label="Branch Name" 
                    value={cheque.branchName} 
                    data-index={index} 
                    data-id="branchName" 
                    onchange={handleDynamicInput} >
                </lightning-input>
                <lightning-input 
                    label="IFSC Code" 
                    value={cheque.Ifsc} 
                    data-index={index} 
                    data-id="Ifsc" 
                    onchange={handleDynamicInput} >
                </lightning-input>

                <!-- Cheque Number -->
                <lightning-input 
                    label="Cheque Number" 
                    value={cheque.chequeNumber} 
                    data-index={index} 
                    data-id="chequeNumber" 
                    onchange={handleDynamicInput} 
                    required>
                </lightning-input>

                <!-- Cheque Date -->
                <lightning-input 
                    type="date" 
                    label="Cheque Date" 
                    value={cheque.chequeDate} 
                    data-index={index} 
                    data-id="chequeDate" 
                    onchange={handleDynamicInput} 
                    required>
                </lightning-input>

                <!-- Cheque Amount -->
                <lightning-input 
                    type="number" 
                    label="Cheque Amount" 
                    value={cheque.chequeAmount} 
                    data-index={index} 
                    data-id="chequeAmount" 
                    onchange={handleDynamicInput} 
                    required>
                </lightning-input>

                <!-- Image Upload -->
                <div class="slds-m-top_medium">
                    <!-- <c-r-t-camer-uploadcomp 
                        image-list={cheque.photoUploadSlots} 
                        data-index={index}
                        onchange={handleFile}>
                    </c-r-t-camer-uploadcomp> -->
                    <!-- <c-camera-upload-component
                        image-list={cheque.photoUploadSlots}
                        data-index={index}
                        onchange={handleFile}
                        disabled={load}>
                    </c-camera-upload-component> -->
                    <c-as-camera
                        image-list={cheque.photoUploadSlots}
                        data-index={index}
                        onchange={handleFile}
                        disabled={load}>
                    </c-as-camera>
                </div>
            </div>
        </template>

        <template if:false={isFieldSense}>
            <div class="slds-box slds-theme_default slds-m-top_medium slds-p-around_medium">
                <lightning-combobox
                    label="Payment Type"
                    value={payTypeSelectedValue}
                    options={payTypeOptions}
                    onchange={handlePayTypeChange}
                    required="true"
                    class="slds-m-bottom_medium">
                </lightning-combobox>

                <lightning-textarea 
                    label="Payment Remark" 
                    value={payRemark} 
                    onchange={handlePayRemark}
                    class="slds-m-bottom_medium">
                </lightning-textarea>
            </div>
        </template>
        
        <!-- Buttons: Add and Submit -->
        <div class="slds-align_absolute-center slds-p-around_medium button-container">
            <lightning-button 
                label="Add Another Cheque" 
                onclick={addAnotherCheque} 
                class="slds-m-right_small">
            </lightning-button>

            <lightning-button 
                label="Submit All Cheques" 
                onclick={handleAllChequeSubmit} 
                variant="brand">
            </lightning-button>
        </div>
    </template>

    <!-- Spinner -->
    <template if:true={load}>
        <div style="display: flex; justify-content: center; align-items: center; height: 100vh;">
            <lightning-spinner alternative-text="Saving..." size="medium"></lightning-spinner>
        </div>
    </template>
    
</template>
