<template>
      <div class="slds-grid slds-grid_align-end slds-m-top_small">
    <lightning-button
        label="New"
        variant="brand"
        onclick={openModal}>
    </lightning-button>
</div>
 <template if:true={isModalOpen}>
        <section
            role="dialog"
            tabindex="-1"
            aria-modal="true"
            class="slds-modal slds-fade-in-open">
                        <div class="slds-modal__container">
                <div class="slds-modal__content slds-p-around_medium">
    <section class="sf-container">

        <!-- Header -->
        <div class="sf-header">
            <span>Non Technical Complaint</span>
        </div>

        <div class="sf-divider"></div>

        <!-- Required Info -->
        <div class="sf-required-info">
            <abbr title="required">*</abbr> = Required Information
        </div>

        <!-- Section -->
        <div class="sf-section-header">Complaint Details</div>

        <div class="sf-section-body">

            <!-- OLD Code -->
            <!-- 
            <div class="sf-row">
                <label class="sf-label required">Complaint Category</label>
                <div class="sf-control">
                    <lightning-input
                        type="text"
                        placeholder="Enter Complaint Category"
                        value={category}
                        onchange={handleChange}
                        data-field="category">
                    </lightning-input>
                </div>
            </div>

            <div class="sf-row">
                <label class="sf-label required">Complaint Sub-Category</label>
                <div class="sf-control">
                    <lightning-input
                        type="text"
                        placeholder="Enter Complaint Sub-Category"
                        value={subCategory}
                        onchange={handleChange}
                        data-field="subCategory">
                    </lightning-input>
                </div>
            </div>
            -->

            <div class="sf-row slds-m-bottom_medium">
                <label class="sf-label required">Complaint Category</label>
                <div class="sf-control">
                    <lightning-combobox
                        placeholder="Select Complaint Category"
                        options={categoryOptions}
                        value={category}
                        onchange={handleCategoryChange}>
                    </lightning-combobox>
                </div>
            </div>

            <div class="sf-row slds-m-bottom_medium">
                <label class="sf-label required">Complaint Sub-Category</label>
                <div class="sf-control">
                    <lightning-combobox
                        placeholder="Select Complaint Sub-Category"
                        options={subCategoryOptions}
                        value={subCategory}
                        onchange={handleSubCategoryChange}
                        disabled={isSubCategoryDisabled}>
                    </lightning-combobox>
                </div>
            </div>



            <!-- Expiry Date -->
             <div class="sf-row">
                <label class="sf-label required">Complaint Description</label>
                <div class="sf-control">
                    <lightning-input
                        type="text"
                        placeholder="Enter Complaint Description"
                        value={description}
                        onchange={handleChange}
                        data-field="description">
                    </lightning-input>
                </div>
            </div>
            <!-- File Upload -->
            <div class="sf-row">
                <label class="sf-label required">Select File</label>
                <div class="sf-control">
                    <lightning-file-upload
                        name="complianceFile"
                        accept=".pdf,.docx,.jpg,.png,.xls,.xlsx"
                        onuploadfinished={handleUploadFinished}
                        multiple="false">
                    </lightning-file-upload>
                </div>
            </div>

        </div>

        <!-- Footer -->
             <div class="sf-footer">
            <lightning-button label="Cancel" variant="neutral" onclick={closeModal}></lightning-button>
            <lightning-button label="Save & New" variant="neutral" class="slds-m-left_small" onclick={handleSubmit}></lightning-button>
            <lightning-button label="Save" variant="brand" class="slds-m-left_small" onclick={handleSubmit}></lightning-button>
        </div>

    </section>
     </div>
                        </div>
        </section>
                <div class="slds-backdrop slds-backdrop_open"></div>
</template>
