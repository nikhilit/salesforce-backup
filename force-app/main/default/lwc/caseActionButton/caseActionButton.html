<template>
    <div class="slds-theme_default slds-m-around_medium slds-rounded_large slds-shadow_small">
        <lightning-input
            type="text"
            label="Remarks"
            placeholder="Please Enter Remarks"
            value={remarks}
            onchange={handleRemarksChange}
            class="slds-m-bottom_small">
        </lightning-input>

        <lightning-button
            variant="brand"
            label="Submit"
            onclick={handleSubmit}
            class="slds-m-top_small"
            disabled={isLoading}>
        </lightning-button>
    </div>
</template>
