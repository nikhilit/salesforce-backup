  <template if:true={isMobile}>
    <div class="slds-p-around_x-small" style="height:100vh;">

        <lightning-card title="Approval Requests" icon-name="action:approval" icon-size="small">

            <template if:true={approvalRequests}>

                <!-- Header -->
                <div class="slds-p-horizontal_x-small slds-m-top_small">
                    <div class="slds-grid slds-grid_align-spread slds-wrap">
                        <div class="slds-text-heading_small">
                            My Approvals
                        </div>
                        <div class="slds-button-group" role="group">
                            <lightning-button
                                label="Approve"
                                onclick={openApproveModal}
                                class="slds-m-right_x-small">
                            </lightning-button>
                            <lightning-button
                                label="Reject"
                                onclick={openRejectModal}
                                variant="destructive">
                            </lightning-button>
                        </div>
                    </div>
                </div>

                <!-- Datatable with horizontal scroll -->
                <div class="slds-scrollable_x slds-m-top_small">
                    <lightning-datatable
                        key-field="id"
                        data={approvalRequests}
                        columns={columns}
                        hide-checkbox-column={hideCheckbox}
                        max-row-selection="10">
                    </lightning-datatable>
                </div>

            </template>

            <template if:true={error}>
                <div class="slds-m-around_medium slds-text-color_error">
                    {error}
                </div>
            </template>

            <!-- Modal (same UI, mobile-width container) -->
            <template if:true={isModalOpen}>
                <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
                    <div class="slds-modal__container slds-modal__container_small">

                        <header class="slds-modal__header">
                            <h2 class="slds-text-heading_medium">{approvalHeader}</h2>

                            </button>
                        </header>

                        <div class="slds-modal__content slds-p-around_small">
                            <lightning-spinner if:true={isSpinner} size="small"></lightning-spinner>

                            <div class="slds-scrollable_x">
                                <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                                    <thead>
                                        <tr>
                                            <th scope="col">Approval Name</th>
                                            <th scope="col">Comments</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <template for:each={selectedApprovals} for:item="approval">
                                            <tr key={approval.workItemIds}>
                                                <td>{approval.ProcessInstanceTargetObjectName}</td>
                                                <td>
                                                    <lightning-input
                                                        type="text"
                                                        data-id={approval.workItemIds}
                                                        variant="label-hidden"
                                                        onchange={handleCommentChange}>
                                                    </lightning-input>
                                                </td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </div>
                        </div>
