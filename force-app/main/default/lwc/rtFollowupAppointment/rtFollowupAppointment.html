<template>

    <template if:true={showEnableMessage}>
        <div class="slds-modal__header">
            <h1 id="modal-heading-01" class="slds-modal__title slds-hyphenate"></h1>
        </div>
        <div class="slds-modal__content slds-is-relative" id="modal-content-id-1" style="font-size: larger;">
            <h1 style="text-align:center;">{message}</h1> 
        </div>
        <div class="slds-modal__footer" style="border-radius:0px;text-align: center;">
            <lightning-button label="Cancel" onclick={handleCancel}></lightning-button>
        </div>  
    </template>

    <template if:false={showEnableMessage}>

        <template if:true={followUpScreen}>
            <lightning-card title="Follow-up Service Appointment">
                <div class="slds-p-around_medium">

                    <lightning-combobox
                        name="followUp"
                        label="Follow-up Remarks"
                        value={followUpRemarks}
                        placeholder="Choose a remark"
                        options={followUpOption}
                        onchange={handleRemarksChange}>
                    </lightning-combobox>

                    <template if:true = {showOtherRemark}>
                        <lightning-textarea label="Other Remarks" value={otherFollowUpRemarks} onchange={handleOtherRemarksChange}></lightning-textarea>
                    </template>          

        <!--           <template if:true={isFollowUpRequired}> --> 
                        <lightning-input type="datetime" label="Follow-up Date" value={followUpDate} onchange={handleDateChange} required></lightning-input>
        <!--           </template> --> 
                    
                    <template if:true={doorLocked}>
                        <div class="slds-box slds-theme_default slds-p-around_medium slds-m-top_medium">
                            <div class="slds-m-bottom_medium">
                                <!-- <c-r-t-camer-uploadcomp image-list={photoUploadSlots} onchange={handleFile}></c-r-t-camer-uploadcomp> -->
                            
                                <c-as-camera
                                    image-list={photoUploadSlots}
                                    data-index={index}
                                    onchange={handleFile}
                                    disabled={isLoading}>
                                </c-as-camera>
                            </div>
                        </div>
                    </template>

                    <div class="slds-m-top_small slds-align_absolute-center">
                        <lightning-button
                            variant="brand"
                            label="Save Follow-up"
                            class="slds-m-top_medium"
                            onclick={handleSave}>
                        </lightning-button>
                    </div>

                </div>
            </lightning-card>
        </template>
        
        <template if:false={followUpScreen}>

            <template if:true={openDomesticHome}>
                <c-auto-home-page-component></c-auto-home-page-component>
            </template>

        </template>

    </template>

    <template if:true={isLoading}>
        <lightning-spinner alternative-text="Please wait..." size="medium"></lightning-spinner>
    </template>
</template>
