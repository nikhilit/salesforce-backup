<template>
    <lightning-card title="Building Demolition Details">
        <div class="slds-p-around_medium">
            <template if:true={recordId}>

                <!-- FIELD INPUTS -->
                <lightning-input
                    type="number"
                    label="Meter Number"
                    value={meterNumber}
                    onchange={handleMeterNumberChange}>
                </lightning-input>

                <br>

                <lightning-button
    label="Validate"
    variant="brand-outline"
    onclick={validateMeterNumber}
    class="slds-m-top_small">
</lightning-button>

                <br>
                <br>
                

                <lightning-input
                    type="number"
                    label="Meter Reading"
                    step="0.01"
                    value={meterReading}
                    onchange={handleMeterReadingChange}>
                </lightning-input>

                <br>

                <lightning-input
    type="date"
    label="Meter Reading Date"
    value={meterReadingDate}
    min={today}
    onchange={handleMeterReadingDateChange}>
</lightning-input>

<br>

                <lightning-combobox
    name="LoopStatus"
    label="Loop Verification Status"
    value={loopStatus}
    placeholder="Select Status"
    options={loopStatusOptions}
    onchange={handleLoopStatusChange}>
</lightning-combobox>

<br>


<lightning-dual-listbox
    name="TypeOfLine"
    label="Type of Line Laid"
    source-label="Available"
    selected-label="Selected"
    field-level-help="Select one or more type of lines laid"
    value={typeOfLine}
    options={typeOfLineOptions}
    onchange={handleTypeOfLineChange}>
</lightning-dual-listbox>


<br>

<!-- MP length input -->
<template if:true={showMpLength}>
    <lightning-input
        type="number"
        label="MP Length"
        step="0.01"
        value={mpLength}
        onchange={handleMpLengthChange}>
    </lightning-input>
    <br>
</template>

<!-- LP length input -->
<template if:true={showLpLength}>
    <lightning-input
        type="number"
        label="LP Length"
        step="0.01"
        value={lpLength}
        onchange={handleLpLengthChange}>
    </lightning-input>
    <br>
</template>
<br>

 <lightning-input
                    label="Lenght of Pipeline"
                    value={lengthOfPipeline}
                    onchange={handleLengthOfPipeline}>
                </lightning-input>
                <br>

                <lightning-input
                    label="Volume of Trench Taken (cu.m)"
                    value={volumeOfTrench}
                    onchange={handleVolumeOfTrench}>
                </lightning-input>
                <br>

               
<!-- 
                <lightning-input
                    label="Material Utilised"
                    value={materialUtilised}
                    onchange={handleMaterialUtilised}>
                </lightning-input> -->
                <br>

<lightning-input
    type="checkbox"
    label="MP Endcap"
    checked={mpEndcap}
    onchange={handleMpEndcapChange}>
</lightning-input>
<br>

<lightning-input
    type="checkbox"
    label="GI Rerouting"
    checked={giRerouting}
    onchange={handleGiReroutingChange}>
</lightning-input>
<br>

<lightning-input
    type="checkbox"
    label="MP Rerouting"
    checked={mpRerouting}
    onchange={handleMpReroutingChange}>
</lightning-input>
<br>

<lightning-input
    type="checkbox"
    label="LP Rerouting"

    onchange={handleLpReroutingChange}>
</lightning-input>
<br>

<lightning-input
    type="checkbox"
    label="LP Endcap"

</lightning-input>
<br>
<br>

            <!-- First Row: Item Code & Item Description -->
<div class="material-row">
    <div class="item-code-wrapper">
        <!-- <lightning-input label="Item Code" name="itemCode" data-index={index}
            value={material.itemCode} onchange={handleMaterialChange}>
        </lightning-input> -->
        <lightning-combobox
    label="Item Code"
    name="itemCode"
    data-index={index}
    value={material.itemCode}
    options={itemCodeOptions}
    onchange={handleMaterialChange}>
</lightning-combobox>
    </div>
    <div class="item-desc-wrapper">
        <!-- <lightning-combobox label="Item Description" name="itemDescription" data-index={index}
            value={material.itemDescription} options={itemDescriptionOptions}
            onchange={handleMaterialChange}>
        </lightning-combobox> -->
        <lightning-combobox
    label="Item Description"
    name="itemDescription"
    data-index={index}
    value={material.itemDescription}
    options={itemDescriptionOptions}
    onchange={handleMaterialChange}>
</lightning-combobox>

    </div>
</div>



            <!-- Second Row: Unit, Quantity, Delete Icon -->
            <div class="material-sub-row">
    <div class="unit-wrapper">
        <!-- <lightning-input label="Unit" name="unit" data-index={index}
            value={material.unit} onchange={handleMaterialChange}>
        </lightning-input> -->
        <lightning-combobox
    label="Unit"
    name="unit"
    data-index={index}
    value={material.unit}
    options={unitOptions}
    onchange={handleMaterialChange}>
</lightning-combobox>
    </div>
    <div class="quantity-wrapper">
        <lightning-input label="Quantity" name="quantity" type="number" data-index={index}
            value={material.quantity} onchange={handleMaterialChange}>
        </lightning-input>
    </div>
    <div class="delete-button-wrapper">
        <lightning-button-icon icon-name="utility:delete" alternative-text="Remove" title="Remove"
            data-index={index} onclick={removeMaterialRow}>
        </lightning-button-icon>
    </div>
</div>


        </div>
    </template>


  <div class="slds-m-top_medium">
        <lightning-button icon-name="utility:add" label="Add Material" onclick={addMaterialRow}>

                <!-- PREVIEW MODAL -->
<template if:true={showPreviewModal}>
    <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
        <div class="slds-modal__container">

            <header class="slds-modal__header">
                <lightning-button-icon icon-name="utility:close"
                    alternative-text="Close"
                    class="slds-modal__close"
                    onclick={closePreview}>
                </lightning-button-icon>
                <h2 class="slds-text-heading_medium">{previewFileName}</h2>
            </header>

            <div class="slds-modal__content slds-p-around_medium">
                
                <!-- IMAGE PREVIEW -->
                <template if:true={isImagePreview}>
                    <img src={previewUrl} style="max-width:100%; border-radius:6px;" />
                </template>

                <!-- PDF PREVIEW -->
                <template if:true={isPdfPreview}>
                    <iframe src={previewUrl} width="100%" height="500px"></iframe>
                </template>

            </div>

            <footer class="slds-modal__footer">
                <lightning-button variant="neutral" label="Close" onclick={closePreview}></lightning-button>
            </footer>
        </div>
    </section>
