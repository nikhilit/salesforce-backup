<template>
    <lightning-card title="Capture Required Images">
        <template if:true={imageUploadPage}>
            <div class="slds-grid slds-wrap">
                <div class="slds-col slds-size_1-of-1">
                    <div>
                        <c-o_-m-camera-upload-comp image-list={photoUploadSlots} onchange={handleFile}>
                        </c-o_-m-camera-upload-comp>
                    </div>

                    <!-- Spinner -->
                    <template if:true={load}>
                        <div class="slds-is-relative slds-m-top_medium">
                            <lightning-spinner alternative-text="Saving..." size="medium"></lightning-spinner>
                        </div>
                    </template>

                    <!-- Buttons -->
                    <div class="slds-m-top_medium slds-align_absolute-center">
                        <lightning-button 
    variant="brand" 
    label="Save" 
    onclick={handleFinalSave}
    disabled={isSaveDisabled}>
</lightning-button>

                    </div>
                </div>
            </div>
        </template>
    </lightning-card>
</template>
