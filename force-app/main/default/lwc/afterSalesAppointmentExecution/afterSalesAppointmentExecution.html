<template>
    <lightning-card title="AFS Reconnection/Disconnection Execution">
        <div class="slds-p-around_medium">

            <!-- Bill Paid + Outstanding + Type/Reason -->
            <!-- <div class="slds-grid slds-wrap slds-gutters">
                <div class="slds-col slds-size_1-of-1 slds-p-bottom_small">
                    <lightning-combobox
                        label="If Bill Paid?"
                        value={billPaid}
                        options={billPaidOptions}
                        onchange={handleBillPaidChange}
                        placeholder="Select">
                    </lightning-combobox>
                </div> -->

                <div class="slds-col slds-size_1-of-1 slds-p-bottom_small">
    <lightning-input
        type="text"
        label=" If Bill Paid ?"
        value={billPaidText}
        maxlength="3"
        onchange={handleBillPaidTextChange}
        placeholder="Enter value">
    </lightning-input>
</div>


                <br>

                <div class="slds-col slds-size_1-of-2 slds-p-bottom_small">
                    <lightning-input
                        type="number"
                        label="Outstanding Amount"
                        value={outstandingAmount}
                        onchange={handleOutstandingAmountChange}>
                    </lightning-input>
                </div>

                <br>

                <!-- <div class="slds-col slds-size_1-of-2 slds-p-bottom_small">
                    <lightning-combobox
                        label="Type"
                        value={typeSelection}
                        options={typeOptions}
                        onchange={handleTypeChange}
                        placeholder="Select">
                    </lightning-combobox>
                </div> -->

                <lightning-input
    label="Type Of Work"
    value={typeSelection}
    disabled>
</lightning-input>


                <template if:true={showReasonPicklist}>
                    <div class="slds-col slds-size_1-of-1 slds-p-bottom_small">
                        <lightning-combobox
                            label="Reason"
                            value={reasonOtherRemark}
                            options={reasonOptions}
                            onchange={handleReasonPicklistChange}
                            placeholder="Select">
                        </lightning-combobox>
                    </div>
                </template>
            </div>
             <br>

            
            <br>
            <br>


            <!-- THREE SECTIONS: Before / After / Meter Counter -->
            <section class="slds-section slds-is-open file-section">
                <h3 class="slds-section__title slds-theme_shade slds-p-around_x-small section-header">
                    <span class="slds-text-heading_small">Before Work</span>
                    <lightning-icon icon-name="utility:upload"
                                    alternative-text="Upload"
                                    title="Upload Files"
                                    size="small"
                                    class="upload-icon"
                                    onclick={triggerFileUpload}
                                    data-input="beforeWorkInput">
                    </lightning-icon>
                </h3>

                <input type="file"
                       accept="image/*,application/pdf"
                       multiple
                       class="hidden-file-input"
                       onchange={handleFilesInputChange}
                       data-label="Before Work"
                       data-input="beforeWorkInput" />

                <div class="preview-list">
                    <template for:each={photoUploadSlotsBeforeWork} for:item="slot">
                        <template if:true={slot.uploaded}>
                            <div key={slot.id} class="preview-item">
                                <span class="file-name">{slot.fileName}</span>
                                <lightning-button-icon
                                    icon-name="utility:preview"
                                    alternative-text="Preview"
                                    title="Preview"
                                    size="small"
                                    onclick={handlePreview}
                                    data-url={slot.previewUrl}
                                    data-name={slot.fileName}>
                                </lightning-button-icon>

                                 <!-- DELETE button -->
                <lightning-button-icon
                    icon-name="utility:delete"
                    alternative-text="Delete"
                    title="Delete Photo"
                    size="small"
                    class="slds-m-left_small"
                    onclick={handleDelete}
                    data-label="Before Work"
                    data-index={slot.index}>
                </lightning-button-icon>
                            </div>
                        </template>
                    </template>
                </div>
            </section>

            <br>
            <br>

           
            <section class="slds-section slds-is-open file-section">
                <h3 class="slds-section__title slds-theme_shade slds-p-around_x-small section-header">
                    <span class="slds-text-heading_small">After Work</span>
                    <lightning-icon icon-name="utility:upload"
                                    alternative-text="Upload"
                                    title="Upload Files"
                                    size="small"
                                    class="upload-icon"
                                    onclick={triggerFileUpload}
                                    data-input="afterWorkInput">
                    </lightning-icon>
                </h3>

                <input type="file"
                       accept="image/*,application/pdf"
                       multiple
                       class="hidden-file-input"
                       onchange={handleFilesInputChange}
                       data-label="After Work"
                       data-input="afterWorkInput" />

                <div class="preview-list">
                    <template for:each={photoUploadSlotsAfterWork} for:item="slot">
                        <template if:true={slot.uploaded}>
                            <div key={slot.id} class="preview-item">
                                <span class="file-name">{slot.fileName}</span>
                                <lightning-button-icon
                                    icon-name="utility:preview"
                                    alternative-text="Preview"
                                    title="Preview"
                                    size="small"
                                    onclick={handlePreview}
                                    data-url={slot.previewUrl}
                                    data-name={slot.fileName}>
                                </lightning-button-icon>
                                 <!-- DELETE button -->
                <lightning-button-icon
                    icon-name="utility:delete"
                    alternative-text="Delete"
                    title="Delete Photo"
                    size="small"
                    class="slds-m-left_small"
                    onclick={handleDelete}
                    data-label="Before Work"
                    data-index={slot.index}>
                </lightning-button-icon>
                            </div>
                        </template>
                    </template>
                </div>
            </section>
            <br>
            <br>

              <section class="slds-section slds-is-open file-section">
                <h3 class="slds-section__title slds-theme_shade slds-p-around_x-small section-header">
                    <span class="slds-text-heading_small">Meter Counter</span>
                    <lightning-icon icon-name="utility:upload"
                                    alternative-text="Upload"
                                    title="Upload Files"
                                    size="small"
                                    class="upload-icon"
                                    onclick={triggerFileUpload}
                                    data-input="meterCounterInput">
                    </lightning-icon>
                </h3>

                <input type="file"
                       accept="image/*,application/pdf"
                       multiple
                       class="hidden-file-input"
                       onchange={handleFilesInputChange}
                       data-label="Meter Counter"
                       data-input="meterCounterInput" />

                <div class="preview-list">
                    <template for:each={photoUploadSlotsMeterWork} for:item="slot">
                        <template if:true={slot.uploaded}>
                            <div key={slot.id} class="preview-item">
                                <span class="file-name">{slot.fileName}</span>
                                <lightning-button-icon
                                    icon-name="utility:preview"
                                    alternative-text="Preview"
                                    title="Preview"
                                    size="small"
                                    onclick={handlePreview}
                                    data-url={slot.previewUrl}
                                    data-name={slot.fileName}>
                                </lightning-button-icon>
                                 <!-- DELETE button -->
                <lightning-button-icon
                    icon-name="utility:delete"
                    alternative-text="Delete"
                    title="Delete Photo"
                    size="small"
                    class="slds-m-left_small"
                    onclick={handleDelete}
                    data-label="Before Work"
                    data-index={slot.index}>
                </lightning-button-icon>
                            </div>
                        </template>
                    </template>
                </div>
            </section>

            <br>
            <br>




              <section class="slds-section slds-is-open">
                    <h3 class="slds-section__title slds-theme_shade slds-p-around_x-small section-header">
                        <span class="slds-text-heading_small">Add Photos</span>
                         <lightning-icon icon-name="utility:upload"
                                        alternative-text="Upload"
                                        title="Upload Files"
                                        size="small"
                                         class="upload-icon"
                                      onclick={triggerFileUpload}
                                      data-input="addPhotosInput">
                        </lightning-icon>
                    </h3>

                    <div class="file-upload-container">
                        <input type="file"
                               accept="image/*,application/pdf"
                               multiple
                               class="hidden-file-input"
                               onchange={handleFilesInputChange}
                               data-label="Add Photos"
                               data-input="addPhotosInput" />

                       
                    </div>
                    <!-- BEFORE WORK PREVIEW LIST -->
<div class="preview-list">
    <template for:each={photoUploadSlotsAddPhotos} for:item="slot">
        <template if:true={slot.uploaded}>
            <div key={slot.id} class="preview-item">
                <span>{slot.fileName}</span>

                <lightning-button-icon
                    icon-name="utility:preview"
                    alternative-text="Preview"
                    title="Preview"
                    size="small"
                    class="slds-m-left_small"
                    onclick={handlePreview}
                    data-url={slot.previewUrl}
                    data-name={slot.fileName}>
                </lightning-button-icon>
                 <!-- DELETE button -->
                <lightning-button-icon
                    icon-name="utility:delete"
                    alternative-text="Delete"
                    title="Delete Photo"
                    size="small"
                    class="slds-m-left_small"
                    onclick={handleDelete}
                    data-label="Before Work"
                    data-index={slot.index}>
                </lightning-button-icon>
            </div>
        </template>
    </template>
</div>

                </section>

                <br>


           
            <!-- Submit -->
            <div class="slds-m-top_medium slds-align_absolute-center">
                <lightning-button variant="brand" label="Submit" onclick={handleSubmit}></lightning-button>
            </div>

            <!-- Preview modal -->
            <template if:true={showPreviewModal}>
                <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
                    <div class="slds-modal__container">
                        <header class="slds-modal__header">
                            <lightning-button-icon icon-name="utility:close"
                                alternative-text="Close"
                                class="slds-modal__close"
                                onclick={closePreview}>
                            </lightning-button-icon>
                            <h2 class="slds-text-heading_medium">{previewFileName}</h2>
                        </header>
                        <div class="slds-modal__content slds-p-around_medium">
                            <template if:true={isImagePreview}>
                                <img src={previewUrl} alt="preview" style="max-width:100%; border-radius:6px;" />
                            </template>
                            <template if:true={isPdfPreview}>
                                <iframe src={previewUrl} width="100%" height="500px"></iframe>
                            </template>
                        </div>
                        <footer class="slds-modal__footer">
                            <lightning-button variant="neutral" label="Close" onclick={closePreview}></lightning-button>
                        </footer>
                    </div>
                </section>
                <div class="slds-backdrop slds-backdrop_open"></div>
            </template>

        
    </lightning-card>
</template>
