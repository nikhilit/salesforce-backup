<template>

  


               <template if:true={load}>

        </template>

        <lightning-card class="slds-card" style="margin-top:-8rem;">

                <div class="slds-p-around_medium" >



                    <template if:true={showMaintenanceEntry}>

                        <!-- calling component which is using apex class
                             <c-co-execution-details-riser-maintenance record-id={recordId} oncancel={handleCancel}></c-co-execution-details-riser-maintenance> 
                         -->

                      <c-co-execution-details-riser-maintenance-offlin record-id={recordId} oncancel={handleCancel}></c-co-execution-details-riser-maintenance-offlin> 


                    </template>


                      <template if:true={riserReplacementForm}>

                      <!-- calling component which is using apex class
 
                    <c-co-execution-details-riser-replacement-comp record-id={recordId} oncancel={handleCancel}> </c-co-execution-details-riser-replacement-comp>
                    
                      -->

                     <c-co-execution-details-riser-replacement-offlin record-id={recordId} oncancel={handleCancel}> </c-co-execution-details-riser-replacement-offlin>


                    </template>

                     <template if:true={riserPaintingCOExecution}>

                         <c-co-execution-details-riser-painting-comp record-id={recordId} oncancel={handleCancel}></c-co-execution-details-riser-painting-comp> 
                    -->

                      <c-co-execution-details-riser-painting-offline record-id={recordId} oncancel={handleCancel}></c-co-execution-details-riser-painting-offline>

                </div>

            </lightning-card>
