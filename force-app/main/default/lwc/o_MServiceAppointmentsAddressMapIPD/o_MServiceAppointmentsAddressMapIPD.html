<template>
    <template if:true={showAppointmentScreen}>
        <!-- Header -->
        <div class="section-header slds-grid slds-grid_align-spread slds-grid_vertical-align-center"
     style="padding: 0.5rem 1rem; background-color: #0170bc;">

    <div class="icon-container">
        <lightning-icon icon-name="utility:back"
                        size="small"
                        class="custom-white-icon"
                        style="--slds-c-icon-color-foreground-default: white;"
                        onclick={handleBacktoaddress}>
        </lightning-icon>
    </div>

    <div class="header-title slds-text-heading_small slds-text-color_inverse">
        Appointments
    </div>

    <div class="icon-container">
        <template if:false={appointmentSearchToggle}>
            <lightning-icon icon-name="utility:search"
                            size="small"
                            class="custom-white-icon"
                            style="--slds-c-icon-color-foreground-default: white;"
                            onclick={handleAppointmentSearch}>
            </lightning-icon>
        </template>

        <template if:true={appointmentSearchToggle}>
            <lightning-icon icon-name="utility:close"
                            size="small"
                            class="custom-white-icon"
                            style="--slds-c-icon-color-foreground-default: white;"
                            onclick={handleAppointmentSearch}>
            </lightning-icon>
        </template>
    </div>
</div>


        <!-- Search Field -->
        <template if:true={appointmentSearchToggle}>
            <div class="slds-border_bottom slds-p-around_x-small">
                <c-custom-input-field-component input-type="search"
                                                placeholder="Search this list..."
                                                onchange={filterAppointmentSearch}>
                </c-custom-input-field-component>
            </div>
        </template>

        <!-- Appointment Cards -->
        <div>
            <template for:each={appointmentResult} for:item="appt">
    <div key={appt.id} class="slds-border--bottom">
        <div class="appointment-card appointment-clickable"
             data-id={appt.id}
             data-account-id={appt.Account}
             onclick={handleAppointmentClick}>

            <!-- Top Row: Notification No + BP No -->
            <div class="slds-grid">
                <div class="slds-media slds-col slds-size_3-of-4">
                    <div class="slds-media__figure">
                        <lightning-icon icon-name="utility:user"
                                        size="x-small"
                                        style="--slds-c-icon-color-foreground-default: #57c062;">
                        </lightning-icon>
                    </div>
                    <div class="slds-media__body">
                        <!-- 1. Notification Number -->
                        <div class="appt-account-name" style={appt.cssStyle}>
                            {appt.notificationNumber}
                        </div>

                        <!-- 2. BP Number -->
                        <div class="appt-bp-number" style={appt.cssStyle}>
                            {appt.bpNumber}
                        </div>
                    </div>
                </div>
                <div class="slds-col slds-size_1-of-4">
                    <div class="card" style={appt.cssStyle}>
                        <span class="card-label card-badge">{appt.label}</span>
                    </div>
                </div>
            </div>

            <!-- Bottom Row: Address, Customer Name, Building Name -->
            <div class="slds-grid">
                <div class="slds-col slds-size_3-of-4">
                    <!-- 3. Address -->
                    <div class="appt-summary" style={appt.cssStyle}>
                        {appt.address}
                    </div>

                    <!-- 4. Customer Name -->
                    <div class="appt-customer-name" style={appt.cssStyle}>
                        {appt.customerFirstName} {appt.customerLastName}
                    </div>

                    <!-- 5. Building Name -->
                    <div class="appt-summary" style={appt.cssStyle}>
                        {appt.buildingName}
                    </div>

                     <!-- 5. ServiceAppointment Start date -->
                    <div class="appt-summary" style={appt.cssStyle}>
                        {appt.schedStartTime}
                    </div>
                </div>
                <div class="slds-col slds-size_1-of-4">
                    <!-- Additional content if needed -->
                </div>
            </div>
        </div>
    </div>
</template>

        </div>
    </template>
</template>
