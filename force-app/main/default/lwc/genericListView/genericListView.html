<template>
    <lightning-card title="Custom Work Order List View">
        <div class="slds-p-around_medium">
            <div class="slds-grid slds-wrap slds-gutters slds-align_absolute-center">
                
                <div class="slds-col slds-size_1-of-3 slds-p-right_small">
                    <lightning-combobox
                        label="Fields to Display"
                        name="fieldSelection"
                        value={selectedFields}
                        options={fieldOptions}
                        onchange={handleFieldChange}
                        multiple
                    ></lightning-combobox>
                </div>

                <div class="slds-col slds-size_1-of-3 slds-p-right_small">
                    <lightning-combobox
                        label="Filter by Field"
                        name="filterField"
                        value={filterField}
                        options={filterOptions}
                        onchange={handleFilterChange}
                    ></lightning-combobox>
                </div>

                <div class="slds-col slds-size_1-of-3">
                    <lightning-input
                        label="Filter Value"
                        name="filterValue"
                        value={filterValue}
                        onchange={handleFilterChange}
                    ></lightning-input>
                </div>
            </div>
            
            <div class="slds-p-top_medium">
                <lightning-button
                    label="Apply Filters"
                    variant="brand"
                    onclick={handleApplyFilter}
                ></lightning-button>
            </div>
            
            <template if:true={workOrders.length}>
                <lightning-datatable
                    key-field="Id"
                    data={workOrders}
                    columns={columns}
                    hide-checkbox-column
                    class="slds-p-top_medium"
                ></lightning-datatable>
            </template>
            <template if:true={error}>
                <p class="slds-text-color_error slds-p-top_medium">{error}</p>
            </template>
        </div>
    </lightning-card>
</template>
