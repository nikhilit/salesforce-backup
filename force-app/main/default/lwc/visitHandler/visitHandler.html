<template>
    <lightning-card title="Unsuccessful Visit">
            <div class="card">
                <lightning-combobox
                    name="reason"
                    class="slds-m-top_small"
                    label="Reason for Unsuccessful Visit"
                    value={selectedReason}
                    placeholder="Select a reason"
                    options={reasonOptions}
                    onchange={handleReasonChange}>
                </lightning-combobox>

                <template if:true={showComments}>
                    <lightning-textarea
                        class="slds-m-top_small"
                        label="Additional Comments"
                        value={comments}
                        onchange={handleCommentsChange}>
                    </lightning-textarea>
                </template>

                                    </template>

                        </div>
                    
                </div> -->

                
                
                <lightning-input 
                    type="file" 
                    label="Select Images" 
                    onchange={handleImageUpload} 
                    multiple 
                    accept="image/jpeg,image/png,image/jpg"
                    disabled={disabled}>
                </lightning-input>

                <template if:true={images}>
                    <div class="slds-grid slds-wrap slds-m-top_medium">
                        <template for:each={images} for:item="image" for:index="index">
                            <div key={image.fileName} class="slds-col slds-size_1-of-2 slds-medium-size_1-of-3 slds-p-around_small">
                                <!-- <lightning-card class="slds-box slds-theme_default"> -->
                                <!-- <lightning-card> -->
                                    <img 
                                        src={image.previewUrl} 
                                        alt={image.fileName} 
                                        style="max-width: 100%; height: auto; border-radius: 0.5rem;" />

                                    <div class="slds-m-top_small">

                                            label="Remove" 
                                            data-index={index} 
                                            onclick={removeImage} 
                                            variant="destructive"
                                            icon-name="utility:delete"
                                            icon-position="left"
                                            class="slds-button_stretch">
                                        </lightning-button> -->
                                    </div>
                                <!-- </lightning-card> -->
                            </div>
                        </template>
                    </div>
                </template>

                <lightning-input
                    type="datetime"
                    class="slds-m-top_small"
                    label="Schedule Follow-up Visit"
                    value={followUpDate}
                    onchange={handleFollowUpChange}>
                </lightning-input>

                <lightning-textarea
                    label="Remarks on follow up visit"
                    class="slds-m-top_small"
                    value={followUpRemarks}
                    onchange={handleRemarkChange}>
                </lightning-textarea>

                <lightning-button
                    variant="brand"
                    class="slds-m-top_small"
                    label="Save Visit Info"
                    onclick={handleSave}>
                </lightning-button>
            </div>
        </lightning-card>
