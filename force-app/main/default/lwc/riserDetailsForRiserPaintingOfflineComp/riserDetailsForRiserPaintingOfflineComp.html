<template>

<lightning-card>

                     <!-- <h2>{workOrderLineItemName}</h2>    -->

                            </div>


                        <template if:true={clampReplacement}>

                                <lightning-input type="number" label="No Of Clamps Replaced" name="noOfClampsReplaced"

                                </lightning-input>
                            </div>

                        </template>


                       <div class="slds-col slds-size_1-of-1 slds-p-around_small">

                          <lightning-input type="checkbox" label="Epoxy Paint Primer"
                               checked={epoxyPaintPrimer} onchange={handleRiserPaintingDetail}>
                                </lightning-input>                                
                                 
                            </div>


                        <template if:true={epoxyPaintPrimer}>

                            <div class="slds-col slds-size_1-of-1 slds-p-around_small">
                                <lightning-input type="text" label="Length Painted Primer" name="lengthPaintedPrimer"

                                </lightning-input>
                            </div>
                            <div class="slds-col slds-size_1-of-1 slds-p-around_small">
                                <lightning-input type="text" label="DFT Reading Primer" name="dFTReadingPrimer"
                                     
                                   value={riserPainting.dFTReadingPrimer} onchange={handleRiserPaintingDetail}>
                                </lightning-input>
                            </div>


                        </template>

</template>

                            <template if:true={leakageRectification}>

                    </lightning-input>
                            </div>

                              <div class="slds-col slds-size_1-of-1 slds-p-around_small">
                              <lightning-input label="Leakage Locations" name="leakageLocations" type="text" 
                        value={riserPainting.leakageLocations} onchange={handleRiserPaintingDetail}>
                    </lightning-input>
                            </div>

                            </div> -->
                            </template>

            <div class="slds-col slds-size_1-of-1 slds-p-around_small">

                         <lightning-input type="checkbox" label="Crimp Guard Replacement"
                               checked={crimpGuardReplacement} onchange={handleRiserPaintingDetail}>
                                </lightning-input>                                
                                 
                            </div>


                        <template if:true={crimpGuardReplacement}>

                            <div class="slds-col slds-size_1-of-1 slds-p-around_small">
                                <lightning-input type="number" label="No of Crimp Guards Replaced" name="noofCrimpGuardsReplaced"
                        value={riserPainting.noofCrimpGuardsReplaced} onchange={handleRiserPaintingDetail}>
                                </lightning-input>
                            </div>

                        </template>
</template>
<template if:true={isStep3}>
     <div class="slds-col slds-size_1-of-1 slds-p-around_small">
        <h3 class="slds-text-heading_small slds-m-bottom_small">
            Material Consumption Report
        </h3>
    <template if:true={hasMaterials}>
        <template for:each={materialList} for:item="mat">
            <div key={mat.rowNumber}
                 class="slds-box slds-m-bottom_small">
<div class="slds-grid slds-grid_vertical">
<div class="slds-col"><span>
    <div class="slds-grid slds-truncate">
<div><span class="slds-truncate">{mat.itemDescription}</span></div>
</div>
</span></div>
<div class="slds-col"><span>
    <div class="slds-grid slds-truncate">
<div><span class="slds-truncate">{mat.itemCode}</span></div>
</div>
</span></div>
<div class="slds-col"><span>
    <div class="slds-grid">
<div><span> Qty : {mat.quantity}

<div><span> </span></div>

                        data-rownumber={mat.rowNumber}
                        onclick={removeMaterialRow}>
                    </lightning-button-icon>

</div>

</div>
            
            </div>
        </template>

        <div class="slds-align_absolute-center slds-m-top_medium">
             <lightning-button icon-name="utility:add" label="Add Material" onclick={openPopup}
        class="slds-m-top_medium">
    </lightning-button>

        </div>

    </div>

       <div>
                  <p style="margin-bottom:1.5rem;"><b>After Painting Photo</b></p>

                                     <lightning-input type="file" name="fileUploader" label="Select files to upload"
                              accept="image/*" onchange={handleFilesAfterPainting}>
            
                </lightning-input>

                      <div if:true={fileNameAfterPainting}>
                      <p>Selected file: {fileNameAfterPainting}</p>
                        </div>
                                </div>


             
</template>

     </div>     

         
        
<div class="slds-m-top_medium slds-align_absolute-center">

    <template if:true={isStep1}>
        <lightning-button
            label="Cancel"
            variant="neutral"
            onclick={handleBack}>
        </lightning-button>

        &nbsp;&nbsp;
    </template>

    <template if:false={isStep1}>
        <lightning-button
            label="Previous"
            onclick={handlePrevious}>
        </lightning-button>

        &nbsp;&nbsp;
    </template>

    <template if:false={isStep3}>
        <lightning-button
            label="Next"
            variant="brand"
            onclick={handleNext}>
        </lightning-button>
    </template>

    <template if:true={isStep3}>
        
        &nbsp;&nbsp;
        <lightning-button
            label="Save"
            variant="brand"
            onclick={handleSave}>
        </lightning-button>
    </template>

</div>

 <lightning-button label="Back" onclick={handleBack} variant="brand">

                                    </lightning-button>

                </div>             -->

</lightning-card>

<template if:true={showPopup}>
    <section role="dialog" class="slds-modal slds-fade-in-open">
        <div class="slds-modal__container">

            <!-- HEADER -->
            <header class="slds-modal__header">
                <h2 class="slds-text-heading_medium">Add Material</h2>
            </header>

            <!-- BODY -->
            <div class="slds-modal__content slds-p-around_medium">

                <!-- ITEM DESCRIPTION (SEARCH) -->
                <div class="dropdown-container" style="position: relative;">
    <lightning-input
        type="search"
        label="Item Description"
        value={popupMaterial.itemDescription}
        placeholder="Type to search..."
        onchange={handlePopupKeyChange} required>
    </lightning-input>

    <!-- DROPDOWN -->
    <template if:true={popupMaterial.showDropdown}>
        <div class="dropdown slds-box slds-scrollable_y" style="position: absolute;
    top: 100%;             
    left: 0;
    right: 0;
    z-index: 9999;    
    max-height: 200px;
    background: white;
    border: 1px solid #d8dde6;">
            <template for:each={popupMaterial.filteredMaterials} for:item="mat">
                <div key={mat.code}
                    class="slds-p-around_x-small slds-border_bottom hoverable"
                    data-code={mat.code}
                    data-description={mat.description}
                    onclick={handlePopupSelect}>
                    {mat.description}
                </div>
            </template>
        </div>
    </template>
</div>

                <lightning-input
                    label="Item Code"
                    value={popupMaterial.itemCode}
                    disabled>
                </lightning-input>

                <!-- QUANTITY -->
                <lightning-input
                    type="number"
                    label="Quantity"
                    value={popupMaterial.quantity}
                    onchange={handlePopupQtyChange} required>
                </lightning-input>

            </div>

            <!-- FOOTER -->
            <footer class="slds-modal__footer">
                <lightning-button label="Cancel" onclick={closePopup}></lightning-button>
                &nbsp;&nbsp;
                <lightning-button label="Save" variant="brand" onclick={saveMaterial}></lightning-button>
            </footer>

        </div>
    </section>

    <div class="slds-backdrop slds-backdrop_open"></div>
</template>


</template>
