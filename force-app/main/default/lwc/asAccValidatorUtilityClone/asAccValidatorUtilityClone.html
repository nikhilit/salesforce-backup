<template>
    <template if:true={showToast}>
        <div class="overlay-blocker">
            <div class="toast-box">
                <div class="slds-notify slds-notify_toast slds-theme_warning" role="alert">
                    <span class="slds-assistive-text">Warning</span>
                    <span class="slds-icon_container slds-icon-utility-warning slds-m-right_small" title="Warning">
                        <lightning-icon icon-name="utility:warning" alternative-text="Warning" size="small"></lightning-icon>
                    </span>
                    <div class="slds-notify__content">
                        <h2 class="slds-text-heading_small">{message}</h2>
                    </div>
                </div>
            </div>
        </div>
    </template>
</template>
