<template>
    <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_small">
        <div class="slds-modal__container slds-is-relative">
            <template if:false={showProgress}>
                <template if:true={load}>
                    <lightning-spinner class="spinner-message" variant="brand"></lightning-spinner>
                </template>
            </template>
            <header class="slds-modal__header">
                <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close"
                    onclick={handleBack}>
                    <svg class="slds-button__icon slds-button__icon_large" aria-hidden="true">
                        <use xlink:href="/apexpages/slds/latest/assets/icons/utility-sprite/svg/symbols.svg#close">
                        </use>
                    </svg>
                    <span class="slds-assistive-text">Close</span>
                </button>
                <h2 id="modal-heading-01" class="slds-modal__title slds-hyphenate">{headerText}</h2>
            </header>
            <div class="slds-modal__content slds-p-around_medium">
                <div class="body-section">
                    <template if:true={isProfileAllowed}>
                        <p class="slds-text-title_bold">
                            Selected Work Order Records: {recordCounts}
                        </p>
                        <p class="slds-p-top--x-small slds-text-color--error slds-text-heading--small"
                            if:true={showError}>
                            No Work Order Records Selected
                        </p>
                        
                        <!-- Progress Bar Section -->
                        <template if:true={showProgress}>
                            <div class="slds-m-top_medium">
                                <div class="slds-text-heading_small slds-m-bottom_x-small">
                                    Processing: {currentStepName}
                                </div>
                                <div class="slds-progress-bar slds-progress-bar_large" aria-valuemin="0" aria-valuemax="100" 
                                     aria-valuenow={progressPercentage} role="progressbar">
                                    <span class="slds-progress-bar__value" style={progressStyle}>
                                        <span class="slds-assistive-text">Progress: {progressPercentage}%</span>
                                    </span>
                                </div>
                                <div class="slds-text-align_center slds-m-top_x-small slds-text-body_small">
                                    Step {currentStep} of {totalSteps} - {progressPercentage}%
                                </div>
                            </div>
                        </template>
                    </template>
                    <template if:false={isProfileAllowed}>
                        <p class="slds-p-top--x-small slds-text-color--error slds-text-heading--small">
                            You are not allowed to approve Work Orders
                        </p>
                    </template>
                </div>
            </div>
            <footer class="slds-modal__footer">
                <button class="slds-button slds-button_neutral" onclick={handleBack}>Cancel</button>
                <button class="slds-button slds-button_brand" disabled={disableSubmit} onclick={handleSubmit}>
                    Save
                </button>
            </footer>
        </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
</template>
