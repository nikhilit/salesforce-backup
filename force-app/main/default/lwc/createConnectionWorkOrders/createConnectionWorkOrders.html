<template>
    <lightning-card title="Create Work Orders">

        <!-- Spinner -->
        <template if:true={isLoading}>
            <div class="slds-p-around_medium">
                <lightning-spinner alternative-text="Loading"></lightning-spinner>
            </div>
        </template>

        <!-- Accounts Table -->
        <template if:true={accounts.length}>
            <div class="slds-p-around_medium">

                <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Select</th>
                            <th>BP Number</th>
                            <th>Full Name</th>
                            <th>Move Out Date</th>
                            <th>Active</th>
                            <th>Connection</th>
                            <th>Start Date</th>
                            <th>End Date</th>
                            <th>Case</th>

                        </tr>
                    </thead>

                    <tbody>
                        <template for:each={accounts} for:item="acc">
                            <tr key={acc.Id}>
                                <td>{acc.rowIndex}</td>

                                <td>
                                    <lightning-input
                                        type="checkbox"
                                        data-id={acc.Id}
                                        onchange={handleRowSelection}>
                                    </lightning-input>
                                </td>

                                <td>{acc.BP_Number__c}</td>
                                <td>{acc.Full_Name__c}</td>
                                <td>{acc.Move_Out_Date__c}</td>
                                <td>{acc.sharinpix__Active__c}</td>
                                <td>{acc.Connection_Object__c}</td>

                                <td>
                                   
                                    <lightning-input
                                        type="datetime"
                                        data-id={acc.Id}
                                        data-field="startDate"
                                        onchange={handleDateChange}>
                                    </lightning-input>
                                     
                                </td>

                                <td>
                                     
                                        <lightning-input
                                            type="datetime"
                                            data-id={acc.Id}
                                            data-field="endDate"
                                            onchange={handleDateChange}>
                                        </lightning-input>
                                     
                                </td>
                                <td>
                                   
    <!-- <lightning-record-picker
        object-api-name="Case"
        placeholder="Select Case"
        data-id={acc.Id}
        data-field="caseId"
        onchange={handleCaseChange}>
    </lightning-record-picker> -->
    <lightning-record-picker
    object-api-name="Case"
    placeholder="Select Case"
    label="Case"
    data-id={acc.Id}
    filter={filter}
    onchange={handleCaseChange}>
</lightning-record-picker>

                                  

</td>

                            </tr>
                        </template>
                    </tbody>
                </table>

                <br>
              <div class="center-button">
                <lightning-button
                    
                    variant="brand"
                    label="Create Work Orders"
                    onclick={handleCreateWO}>
                </lightning-button>
                </div>

                <!-- <div class="slds-p-around_small"> -->
                    <div class="center-button">
        <lightning-button
            label="Back"
            variant="neutral"
            onclick={handleBack}>
        </lightning-button>
        </div>
    <!-- </div> -->

            </div>
        </template>


        <!-- 🚫 NO ACCOUNTS FOUND -->
<template if:true={showNoAccountsMessage}>
    <div class="slds-p-around_medium slds-text-align_center">
        <p class="slds-text-heading_medium slds-text-color_error">
            No Work Order can be created
        </p>
        <p class="slds-m-top_small">
            as there are no relevant Accounts present in the selected Connection.
        </p>

        <div class="slds-m-top_medium">
            <lightning-button
                label="Back"
                variant="neutral"
                onclick={handleBack}> 
            </lightning-button>
        </div>
    </div>
</template>


        

        <!-- Message -->
        <template if:true={message}>
            <div class="slds-p-around_medium">
                <p class="slds-text-color_success">{message}</p>
            </div>
        </template>

    </lightning-card>
</template>
