<!-- workOrderList.html -->
<template>
  <lightning-card title="Work Orders" icon-name="standard:work_order">
    <!-- Loading Spinner -->
    <template if:true={isLoading}>
      <div class="slds-p-around_large slds-align_absolute-center">
        <lightning-spinner
          alternative-text="Loading"
          size="large"
        ></lightning-spinner>
      </div>
    </template>

    <!-- Error Message -->
    <template if:true={errorMessage}>
      <div class="slds-p-around_medium slds-box slds-theme_alert-texture slds-theme_error">
        <p class="slds-text-heading_small slds-m-bottom_small">Error</p>
        <p>{errorMessage}</p>
      </div>
    </template>

    <!-- Data Table -->
    <template if:false={isLoading}>
      <template if:true={hasRecords}>
        <lightning-datatable
          key-field="Id"
          data={workOrders}
          columns={columns}
          hide-checkbox-column="true"
          sorted-direction={sortDirection}
          sorted-by={sortedBy}
          onsort={handleSort}
        ></lightning-datatable>
      </template>

      <!-- No Records Message -->
      <template if:false={hasRecords}>
        <div class="slds-p-around_large slds-align_absolute-center">
          <p>No Work Orders found.</p>
        </div>
      </template>
    </template>
  </lightning-card>
</template>
