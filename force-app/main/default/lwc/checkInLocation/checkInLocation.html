<template>
    <div class="slds-text-align_center slds-m-bottom_medium">
        <h1 class="slds-text-heading_large">Work Order Location</h1>
    </div>

    <template lwc:if={currentLocation}>
        <div class="slds-p-around_medium slds-box slds-m-around_small">
            <p>Your current location:</p>
            <pre>{currentLocationAsString}</pre>
            <lightning-map map-markers={currentLocationAsMarker} zoom-level="16"></lightning-map>
        </div>
    </template>

    <template lwc:if={requestInProgress}>
        <div class="slds-is-relative slds-m-around_medium">
            <lightning-spinner alternative-text="Getting location..."></lightning-spinner>
        </div>
    </template>

    <div class="slds-align_absolute-center slds-m-top_medium">
        <lightning-button
            variant="brand"
            disabled={locationButtonDisabled}
            icon-name="utility:target"
            label="Get Current Location"
            onclick={handleGetCurrentLocationClick}>
        </lightning-button>
    </div>

    <div class="slds-align_absolute-center slds-m-top_medium">
        <lightning-button
            variant="success"
            class="slds-m-right_small"
            label="Check In"
            onclick={handleCheckIn}>
        </lightning-button>
        <lightning-button
            variant="destructive"
            label="Check Out"
            onclick={handleCheckOut}>
        </lightning-button>
    </div>
</template>
