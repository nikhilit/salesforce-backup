<template>
    <lightning-input type="file" accept="image/*;capture=camera" onchange={handleFileChange} capture="environment"></lightning-input>
    <template if:true={filename}>
        <p>Selected File: {filename}</p>
        <p>File Modified Time (ISO): {fileModifiedTime}</p>
        <p>Current Time (ISO): {currentTime}</p>
        <p>File Data: {fileData}</p>
    </template>

    <div style="display: inline-block;">
        <sharinpix-upload-button-custom-lwc
            record-id={recordId}
            permission-id={permissionId}
            enable-toast={enableToast}
            enable-image-sync={enableImageSync}
            enable-action={enableAction}
            file-extensions={fileExtensions}>

            <span class="slds-button slds-button_brand">
                <lightning-icon size="x-small" icon-name="utility:upload" variant="inverse"></lightning-icon>
                <span>&nbsp;&nbsp;Custom Upload Photos</span>
            </span>
        </sharinpix-upload-button-custom-lwc>
    </div>

    <lightning-button
        label="Take Photo (Deeplink)..."
        onclick={handleTakePhoto}
        variant="brand"
    ></lightning-button>
</template>
