<template>
    <div class="html-cell">
        <template if:true={value}>
            <div class="img-btn" onclick={handleClick}>
                <img src={value} alt="Image" class="clickable-img" style="height: 300px;max-width: 300px;cursor:pointer;" />
            </div>
        </template>
    </div>
</template>
