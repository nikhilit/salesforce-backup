<template>
    <lightning-card title="Contractor Work Execution">


        <!-- Meter Number Input + Validate Button -->
        <template if:false={validatedMeter}>
    <lightning-input
        label="Enter Meter Number"
        value={enteredMeterNumber}
        onchange={handleMeterInput}>
    </lightning-input>

    <lightning-input
            label="Meter Reading"
            name="meterReading"
            value={meterReading}
            onchange={handleChange}>
        </lightning-input>

        <lightning-input
            name="meterReadingDate"
            type="date"
            label="Meter Reading Date"
            value={meterReadingDate}
            onchange={handleChange}>
        </lightning-input>

    <lightning-button
        label="Validate Meter Number"
        variant="brand"
        onclick={validateMeterNumber}
        class="slds-m-top_small">
    </lightning-button>

    <template if:true={showConfirmationPrompt}>
    <div class="slds-box slds-theme_alert-texture slds-theme_warning slds-m-top_small">
        <p>The entered meter number does not match the system. Do you want to proceed with this meter number?</p>
        <div class="slds-m-top_small">
            <lightning-button label="Yes" variant="brand" data-choice="yes" onclick={handleProceedWithEnteredMeterNumber}></lightning-button>
            <lightning-button label="No" variant="neutral" class="slds-m-left_small" data-choice="no" onclick={handleProceedWithEnteredMeterNumber}></lightning-button>
        </div>
    </div>
</template>


</template>

<!-- Multi-select Line Type using Checkboxes -->

    <lightning-card title="Type of Line Laid">
        <template for:each={lineTypeOptions} for:item="line">
    <div key={line.value} class="slds-p-around_x-small">
        <lightning-input 
            type="checkbox"
            label={line.label}
            data-id={line.value}
            onchange={handleLineTypeCheckboxChange}>
        </lightning-input>

        <template if:true={line.showLengthInput}>
            <lightning-input 
    type="number"
    label="Length (meters)"
    value={line.length}
    data-id={line.value}
    onchange={handleLengthChange}>
</lightning-input>

        </template>
    </div>
</template>


    </lightning-card>


<lightning-card title="Summary">
    <p class="slds-p-around_medium">
        Total Length of Line Laid: <strong>{totalLineLength}</strong> meters
    </p>
</lightning-card>





            <!-- Material Section -->
<template if:true={showMaterialSection}>
    <h3 class="section-heading">Material Consumption Report</h3>

    <template for:each={materialList} for:item="material" for:index="index">
        <div key={material.itemCode}>

            <!-- First Row: Item Code & Item Description -->
<div class="material-row">
    <div class="item-code-wrapper">
        <lightning-input label="Item Code" name="itemCode" data-index={index}
            value={material.itemCode} onchange={handleMaterialChange}>
        </lightning-input>
    </div>
    <div class="item-desc-wrapper">
        <lightning-combobox label="Item Description" name="itemDescription" data-index={index}
            value={material.itemDescription} options={itemDescriptionOptions}
            onchange={handleMaterialChange}>
        </lightning-combobox>
    </div>
</div>



            <!-- Second Row: Unit, Quantity, Delete Icon -->
            <div class="material-sub-row">
    <div class="unit-wrapper">
        <lightning-input label="Unit" name="unit" data-index={index}
            value={material.unit} onchange={handleMaterialChange}>
        </lightning-input>
    </div>
    <div class="quantity-wrapper">
        <lightning-input label="Quantity" name="quantity" type="number" data-index={index}
            value={material.quantity} onchange={handleMaterialChange}>
        </lightning-input>
    </div>
    <div class="delete-button-wrapper">
        <lightning-button-icon icon-name="utility:delete" alternative-text="Remove" title="Remove"
            data-index={index} onclick={removeMaterialRow}>
        </lightning-button-icon>
    </div>
</div>


        </div>
    </template>

    <div class="slds-m-top_medium">
        <lightning-button icon-name="utility:add" label="Add Material" onclick={addMaterialRow}>
        </lightning-button>
    </div>
</template>

                <!-- PREVIEW MODAL -->
<template if:true={showPreviewModal}>
    <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
        <div class="slds-modal__container">

            <header class="slds-modal__header">
                <lightning-button-icon icon-name="utility:close"
                    alternative-text="Close"
                    class="slds-modal__close"
                    onclick={closePreview}>
                </lightning-button-icon>
                <h2 class="slds-text-heading_medium">{previewFileName}</h2>
            </header>

            <div class="slds-modal__content slds-p-around_medium">
                
                <!-- IMAGE PREVIEW -->
                <template if:true={isImagePreview}>
                    <img src={previewUrl} style="max-width:100%; border-radius:6px;" />
                </template>

                <!-- PDF PREVIEW -->
                <template if:true={isPdfPreview}>
                    <iframe src={previewUrl} width="100%" height="500px"></iframe>
                </template>

            </div>

            <footer class="slds-modal__footer">
                <lightning-button variant="neutral" label="Close" onclick={closePreview}></lightning-button>
            </footer>
        </div>
    </section>

     <div class="slds-backdrop slds-backdrop_open"></div>
</template>


            <!-- Remarks -->
