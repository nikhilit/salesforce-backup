<template>
    <lightning-card title="Customer Not Available">

 <template if:true={isLoading}>
            <lightning-spinner class="spinner-message" variant="brand"></lightning-spinner>
        </template>

        <div class="slds-p-around_medium">
            <template if:false={formDisabled}>
                <lightning-combobox
                    label="Reason"
                    options={reasonOptions}
                    value={reason}
                    onchange={handleReasonChange}
                    required>
                </lightning-combobox>

                <lightning-input 
                    type="date" 
                    label="Follow-Up Date" 
                    onchange={handleDateChange} 
                    required>
                </lightning-input>

                <lightning-textarea 
                    label="Remarks" 
                    value={remarks} 
                    onchange={handleRemarksChange}>
                </lightning-textarea>

                <template if:true={imageUploadPage}>
                    <div class="slds-grid slds-wrap">
                        <div class="slds-col slds-size_1-of-1">
                            <div>
                                <c-o_-m-camera-upload-comp
                                    image-list={photoUploadSlots}
                                    onchange={handleFile}>
                                </c-o_-m-camera-upload-comp>
                            </div> 
                        </div>
                    </div>
                </template>

                <div class="slds-align_absolute-center slds-m-top_medium">
                    <lightning-button 
                        label="Submit" 
                        variant="brand" 
                        onclick={handleSubmit}>
                    </lightning-button>
                </div>
            </template>

            <template if:true={formDisabled}>
                <div class="slds-text-align_center slds-m-around_medium slds-text-color_success">
                    <lightning-icon icon-name="utility:success" alternative-text="Success" class="slds-m-right_small"></lightning-icon>
                    <p>Thank you! Details have been submitted successfully.</p>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
