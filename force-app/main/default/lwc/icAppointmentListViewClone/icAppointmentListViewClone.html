<template>

    <template if:true={secondPage}>

        <div class="custom-container slds-is-relative">

            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
            </template>

            <!-- Error -->
            <template if:true={error}>
                <div class="slds-text-color_error">{error}</div>
            </template>

            <template if:true={hasWorkType}>
                <div class="section-header slds-grid slds-grid_align-spread slds-grid_vertical-align-center"
                    style="margin-left: -2px; margin-right: -2px; margin-top: -5px; background-color: #57c062;">

                    <lightning-icon style="--slds-c-icon-color-foreground-default: white;" icon-name="utility:back"
                        size="small" class="custom-white-icon" onclick={handleBackToHome}>
                    </lightning-icon>

                    <div class="header-title">
                        Work Types
                    </div>

                    <lightning-icon style="--slds-c-icon-color-foreground-default: white;"
                                    icon-name="utility:search" size="small" class="custom-white-icon"
                                    if:false={workTypeSearchToggle} 
                                    onclick={handleWorkTypeSearch}>   
                    </lightning-icon> 

                    <lightning-icon style="--slds-c-icon-color-foreground-default: white;" 
                                    icon-name="utility:close" size="small" class="custom-white-icon" 
                                    onclick={handleWorkTypeSearch}
                                    if:true={workTypeSearchToggle}>
                    </lightning-icon>

                </div>

                <div class="slds-border_bottom slds-p-around_x-small" if:true={workTypeSearchToggle}>
                    <c-custom-input-field-component onchange={filterWorkTypeSearch} input-type="search" placeholder="Search this list..."></c-custom-input-field-component>
                </div>

                <div>

                    <template for:each={workTypeList} for:item="wT">

                        <div key={wT.name} class="slds-border--bottom">

                            <div class="appointment-card appointment-clickable" 
                                 data-name={wT.name}
                                 onclick={handleWorkTypeClick}>

                                <div class="slds-grid">

                                    <div class="slds-col slds-size_1-of-7 slds-align_absolute-center slds-var-m-around_small">
                                        <div class="slds-media__figure">
                                            <lightning-icon icon-name="standard:work_type" size="x-small"
                                                style="--slds-c-icon-color-foreground-default: #57c062;">
                                            </lightning-icon>
                                        </div>
                                    </div>
                                    <div class="slds-col slds-size_4-of-7 slds-var-p-around_x-small slds-align-middle">
                                        <p style="color: black;font-size:15px;">{wT.name}</p>
                                    </div>
                                    <div class="slds-col slds-size_2-of-7  slds-var-p-around_x-small slds-align_absolute-center" >
                                        <div class="round slds-align--absolute-center"> <b>{wT.count}</b></div>
                                    </div>
                                    
                                </div>

                            </div>
                        </div>
                    </template>

                    <template if:false={workTypeList.length}>
                        <p class="slds-text-body_regular slds-text-align_center" style="font-size: 15px;">No appointments for Today.</p>
                    </template>                       
                </div>
            </template>


            <template if:true={hasAppointments}>

                <div class="section-header slds-grid slds-grid_align-spread slds-grid_vertical-align-center"
                    style="margin-left: -2px; margin-right: -2px; margin-top: -5px; background-color: #57c062;">

                    <lightning-icon style="--slds-c-icon-color-foreground-default: white;" icon-name="utility:back"
                        size="small" class="custom-white-icon" onclick={handleBackToAppointment}>
                    </lightning-icon>

                    <div class="header-title">
                        Appointments
                    </div>

                    <lightning-icon style="--slds-c-icon-color-foreground-default: white;"
                                    icon-name="utility:search" size="small" class="custom-white-icon"
                                    if:false={appointmentSearchToggle} 
                                    onclick={handleAppointmentSearch}>   
                    </lightning-icon> 

                    <lightning-icon style="--slds-c-icon-color-foreground-default: white;" 
                                    icon-name="utility:close" size="small" class="custom-white-icon" 
                                    onclick={handleAppointmentSearch}
                                    if:true={appointmentSearchToggle}>
                    </lightning-icon>

                </div>

                <div class="slds-border_bottom slds-p-around_x-small" if:true={appointmentSearchToggle}>
                    <c-custom-input-field-component onchange={filterAppointmentSearch} input-type="search" placeholder="Search this list..."></c-custom-input-field-component>
                </div>

                <div>

                    <template for:each={appointmentsList} for:item="appt">

                        <div key={appt.id} class="slds-border--bottom">

                            <div class="appointment-card appointment-clickable" data-id={appt.id}
                                data-account-id={appt.Account} data-work-order-id={appt.workOrderId} onclick={handleAppointmentClick}>

                                <div class="slds-grid">

                                    <div class="slds-media slds-col slds-size_5-of-6">
                                        <div class="slds-media__figure">
                                            <lightning-icon icon-name="utility:user" size="x-small"
                                                style="--slds-c-icon-color-foreground-default: #57c062;">
                                            </lightning-icon>
                                        </div>
                                        <div class="slds-media__body">
                                            <div class="appt-header">
                                                <div class="appt-account-name">{appt.accountName}</div>
                                            </div>
                                        </div>
                                    </div>                                        
                                </div>

                                <div class="slds-grid" style="margin-bottom: 8px;">
                                    <div class="slds-col slds-size_3-of-4" style="margin-left: 26px;">
                                        <div class="appt-summary">{appt.DetailAccountSummary}</div>
                                    </div>
                                    <div class="slds-col slds-size_1-of-4">
                                    </div>
                                </div>

                                <div class="slds-grid">

                                    <div class="slds-col slds-size_2-of-6" style="margin-left: 3px; padding-right: 5px;">
                                        <div class="card" style="card-total">
                                            <span class="card-label card-badge" style="font-size: 11px;">{appt.formattedSchedEndDate}</span>
                                        </div>
                                    </div>

                                    <div class="slds-col slds-size_2-of-6">
                                        <div class="card" style="card-total">
                                            <span class="card-label card-badge" style="font-size: 11px;">{appt.formattedDueAmount}</span>
                                        </div>
                                    </div>

                                    <div></div>

                                    <div class="slds-col slds-size_2-of-6" style="margin-left: 5px; padding-right: 10px;">
                                        <div class="card" style="card-total">
                                            <span class="card-label card-badge" style="font-size: 11px;">{appt.label}</span>
                                        </div>
                                    </div>

                                </div>

                            </div>
                        </div>
                    </template>

                    <template if:false={appointmentsList.length}>
                        <p class="slds-text-body_regular slds-text-align_center" style="font-size: 15px;">No appointments for Today.</p>
                    </template>                       
                </div>
                
            </template>
        </div>
    </template>
</template>
