<template for:each={workOrderLineItems} for:item="item">
    <div
        key={item.recordId}
        class="slds-col slds-size_1-of-2 slds-p-around_small"
    >
        <div

            style="height:46px;border: 1px solid darkblue;"
        >

                <!-- TEXT : 80% -->
                <div class="slds-col slds-size_4-of-5 slds-text-align_center">
                    <span class="slds-text-heading_x-small">
                        {item.name}
                    </span>
                </div>

                <!-- ICON : 20% -->
                <div class="slds-col slds-size_1-of-5 slds-text-align_right">
                    <lightning-icon
                        icon-name="utility:chevronright"
                        size="xx-small"
                        class="blue-utility-icon"
                        alternative-text="Open">
                    </lightning-icon>
                </div>

            </div>
        </div>
    </div>
</template>
