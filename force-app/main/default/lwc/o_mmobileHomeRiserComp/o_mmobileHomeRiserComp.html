<template>

   

    <template if:true={showSpinner}>
        <lightning-spinner alternative-text="Loading..." size="small"></lightning-spinner>
    </template>

    <template if:true={openMainPage}>
        <div class="main-container">
            <div class="greeting-card">
                <p class="greeting-line">{currentDate}</p>
                <p class="greeting-line">{currentTime}</p>
                <p class="greeting-line" style="margin-top: 10px;">{greeting}</p>
                <p class="greeting-line">Let's get started!</p>
            </div>
        </div>

             <div class="card" style="text-align: center;
    padding: 23px;
    border: 3px solid red;
    display: flex;
    font-weight: bold;
    background-color: green;
    align-items: stretch;" onclick={handleuploadtbtdo}>

             <!-- <div class="icon-section"> -->
                                    <!-- <img src={kpi.iconUrl} style="height: 50px;"/> -->
                                    <lightning-icon icon-name="utility:upload"
                                        alternative-text="Total" size="small" variant="inverse">
                                    </lightning-icon>
                                <!-- </div> -->
                   <p style="font-size:12px;">
                   {tbtStatus}  </p>

                   <lightning-icon icon-name='utility:refresh' onclick={handletbtRefresh}  alternative-text='refresh' size='x-small' title='refresh' class="white-utility-icon"></lightning-icon>
            </div>

    </template>

    <!-- Dashboard Section -->

        <div class="dashboard-wrapper">

            <div class="dashboard-list">

                <div class="slds-p-around_small">
                    <div class="slds-grid slds-wrap">
                        <div class="slds-col slds-size_1-of-1">
                            <div class="card" onclick={onTotalClick}>
                                <div class="icon-section">
                                    <!-- <img src={kpi.iconUrl} style="height: 50px;"/> -->
                                    <lightning-icon icon-name="utility:locker_service_api_viewer"
                                        alternative-text="Total" size="small" variant="inverse">
                                    </lightning-icon>
                                </div>
                                <div>
                                    <span>Total</span>
                                </div>
                                <div>
                                    <strong>{kpis.total}</strong>
                                </div>
                            </div>
                        </div>
                        <template for:each={kpisResult} for:item="kpi">
                            <div class="slds-col slds-size_1-of-1" key={kpi.label}>
                                <div class="card" data-card={kpi.label} onclick={onCardCLick}>
                                    <div class="icon-section">
                                        <!-- <img src={kpi.iconUrl} style="height: 50px;"/> -->
                                        <lightning-icon icon-name={kpi.iconUrl} alternative-text={kpi.label}
                                            size="small" variant="inverse">
                                        </lightning-icon>
                                    </div>
                                    <div>
                                        <strong style="text-align: end;">{kpi.count}</strong>
                                        <span style="margin-right:7rem; margin-top:-2rem;">{kpi.label}</span>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>

            </div>
        </div>
    </template>
