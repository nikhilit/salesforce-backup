<template>

    <template if:true={showSpinner}>
        <lightning-spinner alternative-text="Loading..." size="small"></lightning-spinner>
    </template>

    <template if:true={openMainPage}>
        <div class="main-container">
            <div class="greeting-card">
                <!-- <p class="greeting-line">{currentDate}</p>
                <p class="greeting-line">{currentTime}</p>
                <p class="greeting-line" style="margin-top: 10px;">{greeting}</p>
                <p class="greeting-line">Let's get started!</p> -->
                <img src={mglLogo} style="height:120px">
            </div>
        </div>

    </template>

    <!-- Dashboard Section -->
    <template if:true={showDashboard}>
        <div class="dashboard-wrapper">
            <div class="slds-media slds-media_center slds-border_bottom header-section slds-p-around_small slds-theme--shade"
                style="width: 100%;">
                <!-- <div class="slds-media__figure">

                    </div> -->
                <div class="slds-media__body">
                    <h2 class="slds-card__header-title ">
                        My Today's KPI
                    </h2>
                </div>
                <div class="slds-media__figure slds-media__figure_reverse" style="display: flex;">
                    <!-- <div class="new-button" onclick={handleNew} if:true={mrsCategory}>New</div> -->
                    <h2 class="slds-card__header-title">Metering</h2>
                    <!-- <lightning-button variant="brand-outline" label="Refresh" title="Refresh" onclick={handleRefresh}
                        style="font-size: 10px; --slds-s-button-spacing-inline: 5px; line-height: 20px !important;
                            text-align: center; margin-left: 10px;" class="slds-align_absolute-center">
                        </lightning-button> -->
                        <button class="rkmd-btn btn-xs btn-lightBlue ripple-effect" title="Refresh" onclick={handleRefresh}>
                            Refresh
                        </button>
                    <!-- <lightning-icon icon-name='utility:refresh' alternative-text='refresh' size='x-small' title='refresh'
                        onclick={handleRefresh} style="padding-left: 10px;">
                    </lightning-icon> -->
                </div>
            </div>

            <div class="dashboard-list">

                <div class="slds-p-around_small">
                    <div class="slds-grid slds-wrap">
                        <div class="slds-col slds-size_1-of-1">
                            <div class="card" onclick={onTotalClick}>
                                <div class="icon-section">
                                    <!-- <img src={kpi.iconUrl} style="height: 50px;"/> -->
                                    <lightning-icon icon-name="utility:locker_service_api_viewer"
                                        alternative-text="Total" size="small" variant="inverse">
                                    </lightning-icon>
                                </div>
                                <div>
                                    <span>Total</span>
                                </div>
                                <div>
                                    <strong>{kpis.total}</strong>
                                </div>
                            </div>
                        </div>
                        <template for:each={kpisResult} for:item="kpi">
                            <div class="slds-col slds-size_1-of-2" key={kpi.label}>
                                <div class="card" data-card={kpi.label} onclick={onCardCLick}>
                                    <div class="icon-section">
                                        <!-- <img src={kpi.iconUrl} style="height: 50px;"/> -->
                                        <lightning-icon icon-name={kpi.iconUrl} alternative-text={kpi.label}
                                            size="small" variant="inverse">
                                        </lightning-icon>
                                    </div>
                                    <div>
                                        <strong style="text-align: end;">{kpi.count}</strong>
                                        <span>{kpi.label}</span>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>

            </div>

            <div class="slds-p-around_small" style="width: 100%;" if:true={showAlert}>
                <div style="margin: 32px 16px 0; padding: 12px 20px; background-color: #ffe5e5; border-left: 4px solid #ff4d4d; border-radius: 6px; font-size: 16px; color: #d00000; font-weight: 500;">
                    ⚠️ Kindly note that your Schedule is ending on <strong><lightning-formatted-date-time value={lastDate} year="numeric" month="numeric" day="numeric"
                            hour="2-digit" minute="2-digit">
                    </lightning-formatted-date-time></strong>
                </div>
                <!-- <p style="font-weight: 600; color:rgb(231 75 60)">
                    Kindly note that your Schedule is ending on&nbsp;
                    <span>
                        <lightning-formatted-date-time value={lastDate} year="numeric" month="numeric" day="numeric"
                            hour="2-digit" minute="2-digit">
                        </lightning-formatted-date-time>
                    </span>
                </p> -->
            </div>
        </div>
    </template>

    <!-- Child Component -->
    <template if:true={showChild}>
        <c-service-appointments-address-map selected-status={selectedStatus} open-main-page={openMainPage}
            second-page={secondPage} onchildevent={handleChildEvent} show-dashboard={showDashboard}
            selected-type={selectedType}>
        </c-service-appointments-address-map>
    </template>

    <template if:true={showCreationPage}>
        <c-work-order-creation-component onback={handleBackToMainPage}>
        </c-work-order-creation-component>
    </template>
</template>
