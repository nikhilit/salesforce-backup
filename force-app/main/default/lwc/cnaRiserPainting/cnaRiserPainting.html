<template>
    <template if:true={isVisible}>

        <template if:true={load}>
            <lightning-spinner class="spinner-message" variant="brand"></lightning-spinner>
        </template>
    <lightning-card title="Riser Painting Unsuccessful Visit">
        <div class="slds-p-around_medium">
            <lightning-combobox label="Reason for Unsuccessful Visit"
                                value={selectedReason}
                                options={reasonOptions}
                                onchange={handleReasonChange}>
            </lightning-combobox>

            <template if:true={showOther}>
                <lightning-textarea label="Additional Details" onchange={handleDetailsChange}></lightning-textarea>
            </template>

            <!-- <lightning-file-upload label="Upload Supporting Images"
                                   record-id={recordId}
                                   onuploadfinished={handleUploadFinished}>
            </lightning-file-upload> -->

            <template if:true={imageUploadPage}>
                <div class="slds-grid slds-wrap">
                <div class="slds-col slds-size_1-of-1">
                <div>
                    <c-o_-m-camera-upload-comp
                        image-list={photoUploadSlots}
                        onchange={handleFile}>
                    </c-o_-m-camera-upload-comp>
                </div> 
                </div>
            </div>
            </template>

    
           
            <div class="slds-p-around_medium" style="margin-left:7.3rem;">
    <lightning-button 
        label="Submit" 
        onclick={handleSubmit} 
        variant="brand">
    </lightning-button>
</div>



        </div>
    </lightning-card>
</template>
</template>
