<template>

     <lightning-card>

         <template if:true={load}>
            <lightning-spinner class="spinner-message" variant="brand"></lightning-spinner>
        </template>

                     

        <div class="slds-grid slds-wrap">



            <div class="slds-col slds-size_1-of-1 slds-p-around_small">
                <lightning-input type="number" label="Total Number of Risers" value={risersNumber}
                    onchange={handleRiserChange}  min="0" max="25" required="true" disabled={isReadOnly}>

                </lightning-input>

            </div>

             <div class="slds-col slds-size_1-of-1 slds-p-around_small">

                <lightning-combobox name="picklist" label="Type Of Riser" value={riserPickListValue}
                     options={typeOfRiserOptions} onchange={handlePicklistChange} required="true" disabled={isReadOnly}>
                </lightning-combobox>

            </div>

           

              <div class="slds-col slds-size_1-of-1 slds-p-around_small">
                <lightning-input type="number" label="Number of Floors" value={risersFloors}
                    onchange={handleFloorChange}   required="true" disabled={isReadOnly}>

                </lightning-input>

            </div>

             <div class="slds-col slds-size_1-of-1 slds-p-around_small">
                    <lightning-input type="text" label="Instrument Type & Range" name="instrumentTypeRange"
                        value={instrumentTypeRange} onchange={handleInstrumentType} required="true" ></lightning-input>
                </div>

                  <div class="slds-col slds-size_1-of-1 slds-p-around_small">
                    <lightning-input type="text" label="Calibration Certificate No" name="calibrationCertificateNo"
                        value={calibrationCertificateNo} onchange={handleCalibrationCertificateNo} required="true" >
                    </lightning-input>
                </div>



                <div class="slds-col slds-size_1-of-1 slds-p-around_small">
                    <lightning-input type="Date" label="Calibration Date" name="calibrationDate" value={calibrationDate}
                        onchange={handleCalibrationDate} required="true" ></lightning-input>
                </div>

               

                <div class="slds-col slds-size_1-of-1 slds-p-around_small">

                  <lightning-input type="Date" label="Calibration Due Date" name="calibrationDueDate"
                        value={calibrationDueDate} onchange={handleCalibrationDueDate} required="true" >
                    </lightning-input>
                </div> 

                 
                <div class="slds-col slds-size_1-of-1 slds-p-around_small">
                    <lightning-input type="text" label="Instrument Serial Number " name="instrumentSerialNumber"
                        value={instrumentSerialNumber} onchange={handleInstrumentSerialNumber} required="true" ></lightning-input>
                </div>


             <!-- <div class="slds-col slds-size_1-of-1 slds-p-around_small">

                <lightning-combobox name="picklist" label="Customer found using gas without BP number?" value={havingBPValue}
                     options={havingBPOptions} onchange={handleHavingBPChange} required="true"  disabled={isReadOnly}>
                </lightning-combobox>

            </div>

            <template if:true={showEnterCustomerDetails}>
             <div class="slds-col slds-size_1-of-1 slds-p-around_small">
                    <lightning-textarea  label="Enter Details" name="customerDetails" placeholder="Enter Name, Flat Number and Phone Number"
                        value={customerDetails} onchange={handleCustomerDetailChange} required="true"  disabled={isReadOnly}></lightning-textarea>
                </div>
            </template> -->

                </template>

            </template> -->
            

          
          






         <template if:true={showSaveButton}>

            <div class="slds-p-around_medium" style="margin-left:7.3rem;">

                <lightning-button label="Save" variant="brand" onclick={handleSave}></lightning-button>

            </div>
        </template>


                </div>


       

        

         


          <template if:true={showWorkOrderLineItems}>

          <c-work-order-l-item-riser-replacement-comp record-id={recordId} oncancel={handleCancel}></c-work-order-l-item-riser-replacement-comp> 

            

        </template>


       


        </lightning-card>

      

</template>
